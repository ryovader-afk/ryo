<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出張旅費精算書 自動生成アプリ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
            min-height: 100vh;
            color: #e2e8f0;
        }

        .header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(99, 179, 237, 0.2);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(90deg, #63b3ed, #4fd1c5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 13px;
            color: #94a3b8;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(99, 179, 237, 0.15);
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 24px;
            transition: border-color 0.3s;
        }

        .card:hover {
            border-color: rgba(99, 179, 237, 0.35);
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: #63b3ed;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 20px;
            background: linear-gradient(180deg, #63b3ed, #4fd1c5);
            border-radius: 2px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
        }

        label .required {
            color: #f87171;
            margin-left: 4px;
        }

        input, select, textarea {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(99, 179, 237, 0.2);
            border-radius: 8px;
            padding: 10px 14px;
            color: #e2e8f0;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #63b3ed;
            box-shadow: 0 0 0 3px rgba(99, 179, 237, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        select {
            cursor: pointer;
        }

        .transport-row {
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(99, 179, 237, 0.1);
        }

        .transport-compact-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            align-items: end;
            margin-bottom: 4px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
        }

        .btn-secondary {
            background: rgba(99, 179, 237, 0.1);
            color: #63b3ed;
            border: 1px solid rgba(99, 179, 237, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(99, 179, 237, 0.2);
        }

        .btn-accent {
            background: rgba(251, 191, 36, 0.15);
            color: #f59e0b;
            border: 1px solid rgba(251, 191, 36, 0.4);
        }

        .btn-accent:hover {
            background: rgba(251, 191, 36, 0.3);
        }

        .btn-danger {
            background: rgba(248, 113, 113, 0.1);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.3);
            padding: 8px 12px;
            font-size: 18px;
            line-height: 1;
        }

        .btn-danger:hover {
            background: rgba(248, 113, 113, 0.2);
        }

        .btn-ai {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: white;
            box-shadow: 0 4px 12px rgba(109, 40, 217, 0.3);
        }

        .btn-ai:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(109, 40, 217, 0.4);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .generate-section {
            text-align: center;
            padding: 40px 0 20px;
        }

        .btn-generate {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            font-size: 18px;
            padding: 16px 48px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(5, 150, 105, 0.3);
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(5, 150, 105, 0.4);
        }

        .summary-box {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-top: 16px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .summary-row:last-child {
            border-bottom: none;
        }

        .summary-row.total {
            font-size: 18px;
            font-weight: 700;
            color: #10b981;
            padding-top: 12px;
            border-top: 2px solid rgba(16, 185, 129, 0.3);
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(99, 179, 237, 0.3);
            border-top-color: #63b3ed;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .fee-display {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .fee-display input {
            width: 140px;
        }

        .nights-calc {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 4px;
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(99, 179, 237, 0.2);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .checkbox-item:hover {
            border-color: rgba(99, 179, 237, 0.4);
        }

        .checkbox-item.checked {
            border-color: #63b3ed;
            background: rgba(99, 179, 237, 0.1);
        }

        .checkbox-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #63b3ed;
            cursor: pointer;
            flex-shrink: 0;
        }

        .checkbox-item span {
            font-size: 13px;
            color: #e2e8f0;
        }

        .transport-extras {
            grid-column: 1 / -1;
            display: none;
            gap: 8px;
        }

        .transport-extras.visible {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .transport-extras .form-group label {
            font-size: 12px;
            color: #7c8ba1;
        }

        .transport-extras input, .transport-extras select {
            font-size: 13px;
            padding: 8px 10px;
        }

        .extras-toggle {
            grid-column: 1 / -1;
            font-size: 12px;
            color: #8b5cf6;
            cursor: pointer;
            background: none;
            border: none;
            text-align: left;
            padding: 4px 0;
            font-family: inherit;
        }

        .extras-toggle:hover {
            color: #a78bfa;
        }

        /* flatpickr custom */
        .flatpickr-calendar {
            background: #1e293b !important;
            border: 1px solid rgba(99, 179, 237, 0.3) !important;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5) !important;
            border-radius: 12px !important;
        }
        .flatpickr-day.selected {
            background: #3b82f6 !important;
            border-color: #3b82f6 !important;
        }
        .flatpickr-day:hover {
            background: rgba(99, 179, 237, 0.2) !important;
        }
        .flatpickr-day.today {
            border-color: #63b3ed !important;
        }

        .preset-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }

        .preset-chip {
            padding: 4px 10px;
            font-size: 12px;
            border-radius: 16px;
            background: rgba(99, 179, 237, 0.1);
            border: 1px solid rgba(99, 179, 237, 0.25);
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .preset-chip:hover {
            background: rgba(99, 179, 237, 0.2);
            color: #e2e8f0;
            border-color: rgba(99, 179, 237, 0.4);
        }

        .preset-chip.active {
            background: rgba(59, 130, 246, 0.25);
            border-color: #3b82f6;
            color: #63b3ed;
        }

        .nights-chips {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }

        .nights-chip {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(99, 179, 237, 0.2);
            color: #94a3b8;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            font-family: inherit;
        }

        .nights-chip:hover {
            border-color: rgba(99, 179, 237, 0.5);
            color: #e2e8f0;
        }

        .nights-chip.active {
            background: #3b82f6;
            border-color: #3b82f6;
            color: white;
        }

        .saved-badge {
            display: inline-block;
            font-size: 11px;
            color: #10b981;
            margin-left: 8px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .saved-badge.show {
            opacity: 1;
        }

        .history-panel {
            margin-bottom: 24px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(99, 179, 237, 0.15);
            border-radius: 10px;
            padding: 12px 16px;
            transition: all 0.2s;
        }

        .history-item:hover {
            border-color: rgba(99, 179, 237, 0.35);
        }

        .history-info {
            flex: 1;
            min-width: 0;
        }

        .history-title {
            font-size: 14px;
            font-weight: 600;
            color: #e2e8f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-meta {
            font-size: 12px;
            color: #64748b;
            margin-top: 2px;
        }

        .history-amount {
            font-size: 14px;
            font-weight: 700;
            color: #10b981;
            margin: 0 16px;
            white-space: nowrap;
        }

        .history-actions {
            display: flex;
            gap: 6px;
        }

        .history-actions .btn {
            padding: 6px 12px;
            font-size: 12px;
        }

        .history-empty {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            padding: 20px;
        }

        .history-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: #63b3ed;
            font-size: 14px;
            font-weight: 600;
            background: none;
            border: none;
            font-family: inherit;
            padding: 0;
        }

        .history-toggle:hover {
            color: #90cdf4;
        }

        .history-toggle .arrow {
            transition: transform 0.2s;
            font-size: 12px;
        }

        .history-toggle .arrow.open {
            transform: rotate(90deg);
        }

        /* プレビューモーダル */
        .preview-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 9999;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            overflow-y: auto;
        }
        .preview-overlay.active {
            display: flex;
        }
        .preview-container {
            background: white;
            color: #1a1a1a;
            max-width: 800px;
            width: 100%;
            padding: 48px 40px;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            position: relative;
            font-family: 'Yu Mincho', 'Hiragino Mincho ProN', serif;
            font-size: 13px;
            line-height: 1.6;
            margin: 20px auto;
        }
        .preview-close {
            position: sticky;
            top: 0;
            float: right;
            background: #333;
            color: white;
            border: none;
            border-radius: 50%;
            width: 36px; height: 36px;
            font-size: 18px;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .preview-close:hover { background: #555; }
        .preview-title {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: 4px;
        }
        .preview-right {
            text-align: right;
            margin-bottom: 6px;
            font-size: 12px;
        }
        .preview-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 16px;
        }
        .preview-table th, .preview-table td {
            border: 1px solid #888;
            padding: 6px 10px;
            font-size: 12px;
            vertical-align: middle;
        }
        .preview-table th {
            background: #e8f0fe;
            font-weight: bold;
            text-align: center;
            white-space: nowrap;
            width: 90px;
        }
        .preview-section-title {
            font-size: 14px;
            font-weight: bold;
            margin: 20px 0 8px;
        }
        .preview-box {
            border: 1px solid #888;
            padding: 10px 14px;
            min-height: 50px;
            margin-bottom: 16px;
            white-space: pre-wrap;
            font-size: 12px;
            line-height: 1.7;
        }
        .preview-total-row th {
            background: #1f4e79;
            color: white;
            font-size: 14px;
        }
        .preview-total-row td {
            font-size: 16px;
            font-weight: bold;
            text-align: right;
        }
        .preview-stamp-table th {
            background: #e8f0fe;
        }
        .preview-stamp-table td {
            height: 60px;
        }
        .preview-notes {
            font-size: 10px;
            color: #666;
            margin-top: 16px;
            line-height: 1.8;
        }
        .preview-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }
        .preview-actions button {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
        }
        .preview-btn-word {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
        }
        .preview-btn-pdf {
            background: linear-gradient(135deg, #dc2626, #991b1b);
            color: white;
        }
        .preview-btn-print {
            background: #333;
            color: white;
        }
        @media print {
            body > *:not(.preview-overlay) { display: none !important; }
            .preview-overlay { position: static; background: none; padding: 0; }
            .preview-close, .preview-actions { display: none !important; }
            .preview-container { box-shadow: none; padding: 20px; margin: 0; }
        }

        @media (max-width: 500px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .transport-compact-row {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 18px;
            }
            .btn-remove {
                padding: 8px 16px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-inner">
            <div>
                <h1>出張旅費精算書 自動生成</h1>
                <p>入力するだけで税務署対応の旅費精算書をWord・PDF形式で出力</p>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- 過去の履歴 -->
        <div class="card history-panel">
            <button class="history-toggle" onclick="toggleHistory()">
                <span class="arrow" id="historyArrow">&#9654;</span>
                過去の入力データ
            </button>
            <div id="historySection" style="display: none;">
                <div class="history-list" id="historyList">
                    <div class="history-empty">履歴はまだありません</div>
                </div>
            </div>
        </div>

        <!-- 基本情報 -->
        <div class="card">
            <div class="card-title">基本情報<span class="saved-badge" id="savedBadge">保存済み</span></div>
            <div class="form-grid">
                <div class="form-group">
                    <label>会社名<span class="required">*</span></label>
                    <input type="text" id="companyName" placeholder="株式会社〇〇">
                </div>
                <div class="form-group">
                    <label>所属部署</label>
                    <input type="text" id="department" placeholder="営業部">
                </div>
                <div class="form-group">
                    <label>氏名<span class="required">*</span></label>
                    <input type="text" id="employeeName" placeholder="山田 太郎">
                </div>
                <div class="form-group">
                    <label>役職</label>
                    <select id="position" onchange="togglePositionOther(this)">
                        <option value="一般社員">一般社員</option>
                        <option value="マネージャー">マネージャー</option>
                        <option value="部長">部長</option>
                        <option value="取締役">取締役</option>
                        <option value="代表取締役">代表取締役</option>
                        <option value="代表社員">代表社員（合同会社）</option>
                        <option value="業務執行社員">業務執行社員（合同会社）</option>
                        <option value="その他">その他</option>
                    </select>
                    <input type="text" id="positionOther" placeholder="役職を入力" style="display:none; margin-top: 8px;">
                </div>
            </div>
        </div>

        <!-- 出張情報 -->
        <div class="card">
            <div class="card-title">出張情報</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>出張先<span class="required">*</span></label>
                    <input type="text" id="destination" placeholder="大阪市北区">
                </div>
                <div class="form-group">
                    <label>出張目的<span class="required">*</span>（複数選択可）</label>
                    <div class="checkbox-grid" id="purposeCheckboxes">
                        <label class="checkbox-item"><input type="checkbox" value="不動産会社周り" checked onchange="toggleCheckbox(this)"><span>不動産会社周り</span></label>
                        <label class="checkbox-item"><input type="checkbox" value="物件視察" onchange="toggleCheckbox(this)"><span>物件視察</span></label>
                        <label class="checkbox-item"><input type="checkbox" value="企業訪問" onchange="toggleCheckbox(this)"><span>企業訪問</span></label>
                        <label class="checkbox-item"><input type="checkbox" value="収益物件調査" onchange="toggleCheckbox(this)"><span>収益物件調査</span></label>
                        <label class="checkbox-item"><input type="checkbox" value="管理会社打合せ" onchange="toggleCheckbox(this)"><span>管理会社打合せ</span></label>
                        <label class="checkbox-item"><input type="checkbox" value="コンサル案件" onchange="toggleCheckbox(this)"><span>コンサル案件</span></label>
                        <label class="checkbox-item"><input type="checkbox" value="セミナー・研修" onchange="toggleCheckbox(this)"><span>セミナー・研修</span></label>
                        <label class="checkbox-item"><input type="checkbox" value="契約締結・交渉" onchange="toggleCheckbox(this)"><span>契約締結・交渉</span></label>
                        <label class="checkbox-item"><input type="checkbox" value="その他" onchange="toggleOther(this)"><span>その他</span></label>
                    </div>
                    <input type="text" id="purposeOther" placeholder="その他の目的を入力" style="display:none; margin-top: 8px;">
                </div>
                <div class="form-group">
                    <label>出発日<span class="required">*</span></label>
                    <input type="date" id="startDate">
                </div>
                <div class="form-group">
                    <label>帰着日<span class="required">*</span></label>
                    <input type="date" id="endDate">
                </div>
                <div class="form-group">
                    <label>泊数<span class="required">*</span></label>
                    <input type="number" id="nights" min="1" value="1" onchange="updateCalc(); updateNightsChips();">

                extras.classList.remove('visible');

        // Date sync
        document.getElementById('startDate').addEventListener('change', syncDates);
        document.getElementById('endDate').addEventListener('change', syncDates);
        document.getElementById('nights').addEventListener('change', function() {
            const start = document.getElementById('startDate').value;
            if (start) {
                const startD = new Date(start);
                const nights = parseInt(this.value) || 1;
                startD.setDate(startD.getDate() + nights);
                document.getElementById('endDate').value = startD.toISOString().split('T')[0];
            }
            updateCalc();
        });

        function syncDates() {
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;
            if (start && end) {
                const startD = new Date(start);
                const endD = new Date(end);
                const diff = Math.round((endD - startD) / (1000 * 60 * 60 * 24));
                if (diff > 0) {
                    document.getElementById('nights').value = diff;
                    updateCalc();
                }
            }
        }

        function updateCalc() {
            const nights = parseInt(document.getElementById('nights').value) || 1;
            const days = nights + 1;
            const accFee = parseInt(document.getElementById('accommodationFee').value) || 0;
            const dailyFee = parseInt(document.getElementById('dailyAllowance').value) || 0;

            document.getElementById('nightsCalc').textContent = `${nights}泊${days}日`;

            const totalAcc = accFee * nights;
            const totalDaily = dailyFee * days;

            let totalTransport = 0;
            document.querySelectorAll('.t-amount').forEach(el => {
                totalTransport += parseInt(el.value) || 0;
            });

            const grand = totalAcc + totalDaily + totalTransport;

            document.getElementById('sumAccommodation').textContent = formatYen(totalAcc);
            document.getElementById('sumAllowance').textContent = formatYen(totalDaily);
            document.getElementById('sumTransport').textContent = formatYen(totalTransport);
            document.getElementById('sumTotal').textContent = formatYen(grand);
        }

        function formatYen(n) {
            return '\u00a5' + n.toLocaleString('ja-JP');
        }

        function getTransportDetails() {
            const rows = document.querySelectorAll('.transport-row');
            const details = [];
            rows.forEach(row => {
                const date = row.querySelector('.t-date').value;
                const route = row.querySelector('.t-route').value;
                const method = row.querySelector('.t-method').value;
                const amount = parseInt(row.querySelector('.t-amount').value) || 0;
                if (route || amount > 0) {
                    const detail = { date, route, method, amount };
                    const extras = row.querySelector('.transport-extras');
                    if (extras) {
                        const seatClass = extras.querySelector('.t-seat-class');
                        const note = extras.querySelector('.t-note');
                        const airline = extras.querySelector('.t-airline');
                        const flightNo = extras.querySelector('.t-flight-no');
                        const line = extras.querySelector('.t-line');
                        const taxiReason = extras.querySelector('.t-taxi-reason');
                        const rentalCompany = extras.querySelector('.t-rental-company');
                        const rentalReason = extras.querySelector('.t-rental-reason');

                        if (seatClass && seatClass.value) detail.seat_class = seatClass.value;
                        if (note && note.value) detail.note = note.value;
                        if (airline && airline.value) detail.airline = airline.value;
                        if (flightNo && flightNo.value) detail.flight_no = flightNo.value;
                        if (line && line.value) detail.line = line.value;
                        if (taxiReason && taxiReason.value) detail.taxi_reason = taxiReason.value;
                        if (rentalCompany && rentalCompany.value) detail.rental_company = rentalCompany.value;
                        if (rentalReason && rentalReason.value) detail.rental_reason = rentalReason.value;
                    }
                    details.push(detail);
                }
            });
            return details;

        function _generateTripReason(purposes, destination, nights, purposeDetail) {

            const reasonSnippets = {
                '不動産会社周り': [
                    `当社の資産運用戦略に基づき、${destination}所在の不動産仲介業者複数社を訪問し、投資用不動産に関する市場調査および具体的案件の検討を実施する。訪問先においては、現在流通中の収益物件に関する詳細情報の収集、物件の立地環境・周辺相場・建物の構造的健全性・修繕履歴・管理体制・収益性（表面利回り・実質利回り・NOI）等について、書面および写真資料のみでは判断が困難な現場固有の情報を実地に確認する。加えて、当該エリアにおける今後の都市開発計画・人口動態・賃貸需要の見通し等について、地元業者からの一次情報を直接聴取する。不動産仲介業者との対面での信頼関係構築は、非公開の優良物件情報を優先的に入手するうえで極めて重要であり、電話・メール等の非対面手段では代替できない業務である。`,
                    `${destination}における不動産投資市場の最新動向把握および具体的な投資案件の精査を目的とする。当社は資産管理会社として中長期的な資産形成を経営方針に掲げており、定期的な現地市場調査は投資判断の精度向上に不可欠な業務である。現地の不動産会社を複数社訪問し、取扱物件の内覧（外観・内装・設備の状態確認）、周辺環境の実地調査（最寄り駅からの実際の徒歩距離・時間帯による人通り・騒音レベル・日照条件・嫌悪施設の有無等）、および管理状況の視察を行う。不動産投資においては、インターネット上の情報や書面資料では把握しきれない現地固有の事情（建物の実際の管理状態・入居者層・近隣住民の属性・将来の再開発情報等）を直接確認することが、リスク回避と適正な投資判断のために必要不可欠であり、リモートでの対応では到底代替できない業務である。`,
                    `当社の事業計画に基づく不動産ポートフォリオの拡充・最適化を目的とし、${destination}エリアの不動産仲介会社を訪問する。具体的には、当該エリアにおける賃貸市場の需給バランス・家賃相場のトレンド・空室率の推移・新規供給の動向等について、現地業者からの最新情報を直接聴取するとともに、投資候補物件について現地での内覧・周辺環境調査を実施する。また、既存の取引仲介業者との関係強化および新規仲介ルートの開拓を通じて、今後の優良案件の確保に向けた基盤整備を行う。資産管理会社としての適正な投資判断を下すためには、現地の状況を自らの目で確認し、数字には表れない定性的情報を収集することが経営上の責務であり、遠隔では対応不可能な業務である。`,
                ],
                'クライアント相談': [
                    `不動産コンサルティング業務の一環として、${destination}のクライアント（不動産オーナー・投資家）との対面による資産運用相談を実施する。今回の訪問では、クライアントが保有する収益物件のポートフォリオ分析結果の報告、各物件の収益性改善提案（リノベーション計画・家賃改定・テナントミックスの見直し等）、新規物件取得に関する投資判断のアドバイス、物件売却の適正タイミングに関するマーケット分析の共有、および資産承継・相続対策を見据えた中長期的な不動産戦略の策定を予定している。本件はクライアントの資産情報・財務状況・家族構成等の極めて機密性の高い個人情報を扱う協議であり、情報漏洩リスクの観点からオンライン会議ではなく対面での実施が不可欠と判断した。加えて、不動産コンサルティングにおいてはクライアントとの深い信頼関係が業務の根幹であり、対面でのきめ細やかなコミュニケーションが顧客満足度とリピート率の向上に直結する。`,
                    `${destination}のクライアント（法人・個人投資家）を訪問し、不動産資産の運用状況に関する定期レビューおよびコンサルティング協議を行う。具体的には、保有物件の稼働状況・収支実績の分析報告、市場環境の変化に応じた運用方針の見直し提案、バリューアップ施策（設備更新・間取り変更・用途変更等）の検討、融資条件の見直しに伴うキャッシュフロー改善策の提示、および税務面を考慮した最適な物件入替え戦略の協議を実施する。不動産コンサルティングにおいては、クライアントの経営環境・資産背景・将来ビジョンを深く理解した上での個別最適な提案が求められるため、定期的な対面での深い対話が不可欠である。`,
                ],
                '企業訪問': [
                    `${destination}の不動産関連企業（デベロッパー・建設会社・リフォーム会社・設計事務所等）を訪問し、当社の不動産コンサルティング事業に関連する対面打ち合わせを実施する。訪問先においては、物件のバリューアップに関する施工提案の検討・見積り協議、保有物件の修繕計画に関する技術的な打ち合わせ、新規開発案件に関する情報交換、業界の最新トレンド（建築コストの動向・建材の供給状況・省エネ基準の改正等）に関する意見交換、および今後の事業連携に向けた協力体制の構築を行う。不動産事業においては、施工会社・設計事務所等の協力パートナーとの密接な信頼関係が物件の品質と収益性を左右するため、定期的な対面訪問による関係構築・維持が不可欠である。`,
                    `${destination}において、当社の不動産コンサルティング事業に関係する金融機関・税理士事務所・司法書士事務所・保険会社等の専門機関を訪問する。各訪問先では、クライアントへの提案に必要な融資条件の最新動向ヒアリング、不動産関連税制の改正に伴う対応策の協議、物件取引に関する法務手続きの確認、および火災保険・賠償責任保険等のリスクマネジメントに関する情報収集を行う。不動産コンサルティングでは、不動産のみならず金融・税務・法務等の多角的な専門知識を駆使した総合的なアドバイスが求められるため、各分野の専門家との対面での情報交換と人脈構築が事業遂行上必要不可欠である。`,

                'コンサル案件': [

                    `${destination}のクライアントが検討中の不動産投資案件について、デューデリジェンス（物件精査）およびフィージビリティスタディ（事業性調査）を実施する。具体的には、投資対象物件の現地内覧と詳細調査（構造・設備・法的制約・環境リスク等）、周辺エリアの市場分析（賃貸需要・供給動向・人口推移・再開発計画等）、収支シミュレーションの前提条件の現地検証、および地元不動産業者・管理会社・金融機関からの情報収集を行う。不動産投資のコンサルティングにおいては、書面資料やデータだけでは把握できない現場固有のリスク要因と収益機会を直接確認することが、クライアントに対する責任あるアドバイスの前提条件である。`,
                ],
                'セミナー・研修': [

                    `${destination}で開催される宅地建物取引業・不動産コンサルティング関連の研修プログラムに参加する。当該研修は、不動産コンサルティング技能の向上を目的とし、最新の不動産鑑定評価手法・マーケット分析技術・クライアントコミュニケーション手法・コンプライアンス対応等の実務的内容を扱う。研修にはケーススタディ・グループワーク形式のセッションが含まれるため、オンラインでの参加では十分な学習効果が得られず、現地への出張が不可欠である。研修で習得した知見は、帰社後にクライアント対応の品質向上に直接反映する。`,
                ],
                '契約締結・交渉': [
                    `${destination}において、不動産売買契約・賃貸借契約・管理委託契約等に関する重要な契約交渉を実施する。交渉事項には、売買代金・賃料等の価格条件、引渡し時期・条件、瑕疵担保（契約不適合）責任の範囲と期間、原状回復義務の範囲、修繕費用の負担区分、中途解約条件、敷金・保証金の取扱い、および特約条項の内容等、不動産取引特有の専門的かつ詳細な協議が含まれる。不動産取引は数千万円から数億円規模の高額取引であり、契約書の各条項がクライアントの資産価値と将来の収益に直接影響するため、対面での慎重な逐条確認と相手方との直接交渉が不可欠である。不動産コンサルタントとして、クライアントの利益を最大限に保護する契約内容の実現を図る。`,
                    `${destination}の取引先（売主・買主・テナント・管理会社等）を訪問し、不動産関連契約の締結または条件変更に係る交渉を実施する。具体的には、既存賃貸借契約の更新条件交渉（賃料改定・契約期間・特約事項の見直し）、新規物件取得に伴う売買契約条件の詰め、管理委託契約の内容見直しと管理報酬の適正化交渉、および工事請負契約の仕様・金額・工期に関する協議を行う。不動産に関する契約は権利関係が複雑であり、書面のみのやり取りでは認識の齟齬が生じやすいため、専門知識を持つ当社が対面で直接交渉に臨むことが、クライアントの利益保護と円滑な取引成立のために必要不可欠である。`,
                ],
                '物件視察': [

                    `${destination}における保有物件の現地管理業務を実施する。建物の経年劣化に伴う修繕必要箇所の早期発見と対応優先度の判定、空室の現況確認と原状回復工事の要否判断、入居者からの要望事項の現場確認、周辺環境の変化が物件価値に与える影響の実地調査等を行う。資産管理会社として、保有不動産の価値最大化と適正な維持管理は経営の根幹に関わる業務であり、現地を直接確認せずにリモートのみで判断することは、経営上のリスクを増大させるため適切ではない。本視察は法人として必要かつ合理的な業務である。`,
                ],
                '収益物件調査': [

                    `新規収益物件の取得検討に係る現地調査を目的とする。${destination}エリアの賃貸市場動向の把握、候補物件の立地・建物状況・収益性の実地確認、管理体制の適正性評価、および地元の不動産仲介業者との情報交換を実施する。物件の収益性を正確に評価するためには、書面上の利回り計算だけでなく、現地の実態（建物の実際の管理レベル・入居者の質・周辺の生活利便性・将来的な資産価値の見通し等）を直接確認することが不可欠であり、これは資産管理会社としての適正な投資判断プロセスにおいて省略できない業務である。`,
                ],
                '管理会社打合せ': [

                    `${destination}の物件管理会社を訪問し、半期に一度の包括的な管理業務レビューを実施する。管理報告書の詳細な内容確認、各物件の収支分析と改善提案の協議、空室対策（リフォーム・家賃設定・広告戦略）の検討、入居審査基準の見直し、および今後の管理体制に関する戦略的な検討を行う。管理会社との良好な関係維持と適正な管理品質の確保は、保有不動産の資産価値と安定収益を守るために欠かせない経営業務である。`,

            } else {

            if (purposeDetail && purposeDetail.trim()) {

        // ============================================================
        // Date formatting helpers (Japanese era)
        // ============================================================

        function formatDateJp(dateStr) {
            if (!dateStr) return '';
            try {
                const parts = dateStr.split('-');
                const year = parseInt(parts[0]);
                const month = parseInt(parts[1]);
                const day = parseInt(parts[2]);
                let era, warekiYear;
                if (year >= 2019) {
                    warekiYear = year - 2018;
                    era = '令和';
                } else if (year >= 1989) {
                    warekiYear = year - 1988;
                    era = '平成';
                } else {
                    warekiYear = year - 1925;
                    era = '昭和';
                }
                return `${era}${warekiYear}年${month}月${day}日`;
            } catch (e) {
                return dateStr;
            }
        }

        function formatCurrency(amount) {
            return '\u00a5' + Number(amount).toLocaleString('ja-JP');
        }

        function buildTransportNote(td) {
            const parts = [];
            if (td.airline) parts.push(td.airline);
            if (td.flight_no) parts.push('便名:' + td.flight_no);
            if (td.seat_class) parts.push(td.seat_class);
            if (td.line) parts.push(td.line);
            if (td.taxi_reason) parts.push('理由:' + td.taxi_reason);
            if (td.rental_company) parts.push(td.rental_company);
            if (td.rental_reason) parts.push('理由:' + td.rental_reason);
            if (td.note) parts.push(td.note);
            return parts.join('\uff0f');
        }

        // ============================================================
        // DOCX Generation (client-side using docx library)

        async function generateDocx(payload) {
            const {
                Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell,
                WidthType, AlignmentType, BorderStyle, ShadingType,
                HeadingLevel, convertInchesToTwip, TableLayoutType,
                VerticalAlign, PageOrientation
            } = window.docx;

            const nights = payload.nights;
            const days = nights + 1;
            const totalAccommodation = payload.accommodation_fee * nights;
            const totalAllowance = payload.daily_allowance * days;
            const transportTotal = payload.transport_details.reduce((s, t) => s + (t.amount || 0), 0);
            const grandTotal = totalAccommodation + totalAllowance + transportTotal;

            const startDateJp = formatDateJp(payload.start_date);
            const endDateJp = formatDateJp(payload.end_date);
            const today = new Date();
            const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
            const todayJp = formatDateJp(todayStr);

            const purpose = payload.purpose || payload.purposes.join('\u30FB');

            // Helper: create a text run
            function tr(text, opts = {}) {
                return new TextRun({
                    text: text,
                    font: opts.font || '游明朝',
                    size: (opts.size || 10.5) * 2,
                    bold: opts.bold || false,
                    color: opts.color || '000000',
                    eastAsiaFont: opts.font || '游明朝',
                });
            }

            // Helper: header cell
            function headerCell(text, width) {
                return new TableCell({
                    width: { size: width, type: WidthType.DXA },
                    shading: { type: ShadingType.SOLID, color: 'E8F0FE', fill: 'E8F0FE' },
                    verticalAlign: VerticalAlign.CENTER,
                    children: [new Paragraph({
                        alignment: AlignmentType.CENTER,
                        children: [tr(text, { font: '游ゴシック', size: 9, bold: true })],
                    })],
                });
            }

            // Helper: value cell
            function valueCell(text, width, alignment) {
                return new TableCell({
                    width: { size: width, type: WidthType.DXA },
                    verticalAlign: VerticalAlign.CENTER,
                    children: [new Paragraph({
                        alignment: alignment || AlignmentType.LEFT,
                        children: [tr(text, { size: 10 })],
                    })],
                });
            }

            // Basic info table
            const infoRows = [
                ['所属部署', payload.department, '役職', payload.position],
                ['出張者氏名', payload.employee_name, '', ''],
                ['出張期間', `${startDateJp}\u3000～\u3000${endDateJp}`, '泊数', `${nights}泊${days}日`],

            const infoTableRows = infoRows.map(r =>

            const reasonParagraphs = reasonText.split('\n').map(line =>

            // Transport table

        // ============================================================
        // PDF Generation (client-side using pdf-lib + fontkit)
        // ============================================================

        let _cachedFontBytes = null;

        async function loadJapaneseFont() {
            if (_cachedFontBytes) return _cachedFontBytes;
            const fontUrls = [
                'NotoSansJP-Regular.ttf',
                'https://fonts.gstatic.com/s/notosansjp/v56/-F6jfjtqLzI2JPCgQBnw7HFyzSD-AsregP8VFBEj75s.ttf',
            ];
            for (const url of fontUrls) {
                try {
                    const resp = await fetch(url);
                    if (!resp.ok) continue;
                    _cachedFontBytes = await resp.arrayBuffer();
                    return _cachedFontBytes;
                } catch (e) { console.warn('Font load failed:', url); }
            }
            throw new Error('日本語フォントの読み込みに失敗しました');
        }

        async function generatePdf(payload) {
            const { PDFDocument, rgb, StandardFonts } = PDFLib;

            const fontBytes = await loadJapaneseFont();
            const pdfDoc = await PDFDocument.create();
            pdfDoc.registerFontkit(fontkit);
            const jpFont = await pdfDoc.embedFont(fontBytes, { subset: false });

            const nights = payload.nights;
            const days = nights + 1;
            const totalAccommodation = payload.accommodation_fee * nights;
            const totalAllowance = payload.daily_allowance * days;
            const transportTotal = payload.transport_details.reduce((s, t) => s + (t.amount || 0), 0);
            const grandTotal = totalAccommodation + totalAllowance + transportTotal;

            const startDateJp = formatDateJp(payload.start_date);
            const endDateJp = formatDateJp(payload.end_date);
            const todayD = new Date();
            const todayStr = `${todayD.getFullYear()}-${String(todayD.getMonth()+1).padStart(2,'0')}-${String(todayD.getDate()).padStart(2,'0')}`;
            const todayJp = formatDateJp(todayStr);
            const purpose = payload.purpose || payload.purposes.join('・');

            // A4 dimensions in points
            const W = 595.28, H = 841.89;
            const ML = 70, MR = 70, MT = 70;
            const CW = W - ML - MR;

            let page = pdfDoc.addPage([W, H]);
            let y = H - MT;

            function checkPage(need) {
                if (y - need < 50) {
                    page = pdfDoc.addPage([W, H]);
                    y = H - MT;
                }
            }

            // Helper: draw text
            function drawText(text, x, yp, size, opts = {}) {
                page.drawText(text || '', { x, y: yp, size, font: jpFont, color: opts.color || rgb(0,0,0) });
            }

            // Helper: draw table
            function drawTable(rows, colWidths, startY, opts = {}) {
                const rowH = opts.rowHeight || 22;
                const headerBg = opts.headerBg || null;
                const fontSize = opts.fontSize || 9;
                const headerRows = opts.headerRows || 0;
                let cy = startY;

                for (let ri = 0; ri < rows.length; ri++) {
                    checkPage(rowH + 10);
                    const row = rows[ri];
                    let cx = ML;
                    const isHeader = ri < headerRows;
                    const currentRowH = isHeader ? rowH : (opts.bodyRowHeight || rowH);

                    for (let ci = 0; ci < row.length; ci++) {
                        const cw = colWidths[ci];
                        // Background
                        if (isHeader && headerBg) {
                            page.drawRectangle({ x: cx, y: cy - currentRowH, width: cw, height: currentRowH, color: headerBg });
                        }
                        if (opts.cellBg && opts.cellBg[ri] && opts.cellBg[ri][ci]) {
                            page.drawRectangle({ x: cx, y: cy - currentRowH, width: cw, height: currentRowH, color: opts.cellBg[ri][ci] });
                        }
                        // Border
                        page.drawRectangle({ x: cx, y: cy - currentRowH, width: cw, height: currentRowH,
                            borderColor: rgb(0.5, 0.5, 0.5), borderWidth: 0.5 });
                        // Text
                        const textColor = (opts.textColor && opts.textColor[ri] && opts.textColor[ri][ci]) || rgb(0,0,0);
                        const cellText = String(row[ci] || '');
                        // Wrap long text
                        const maxChars = Math.floor(cw / (fontSize * 0.55));
                        const lines = [];
                        for (let s = 0; s < cellText.length; s += maxChars) {
                            lines.push(cellText.substring(s, s + maxChars));
                        }
                        if (lines.length === 0) lines.push('');
                        const lineH = fontSize + 3;
                        const textStartY = cy - currentRowH / 2 + (lines.length - 1) * lineH / 2;
                        lines.forEach((line, li) => {
                            const align = (opts.align && opts.align[ci]) || 'left';
                            let tx = cx + 4;
                            if (align === 'center') {
                                const tw = jpFont.widthOfTextAtSize(line, fontSize);
                                tx = cx + (cw - tw) / 2;
                            } else if (align === 'right') {
                                const tw = jpFont.widthOfTextAtSize(line, fontSize);
                                tx = cx + cw - tw - 4;
                            }
                            page.drawText(line, { x: tx, y: textStartY - li * lineH, size: fontSize, font: jpFont, color: textColor });
                        });
                        cx += cw;
                    }
                    cy -= currentRowH;
                }
                return cy;
            }

            // === Title ===
            const titleText = '出張旅費精算書';
            const titleW = jpFont.widthOfTextAtSize(titleText, 18);
            drawText(titleText, (W - titleW) / 2, y, 18);
            y -= 28;

            // === Date ===
            const dateText = `作成日：${todayJp}`;
            const dateW = jpFont.widthOfTextAtSize(dateText, 9);
            drawText(dateText, W - MR - dateW, y, 9);
            y -= 14;

            // === Company ===
            const compW = jpFont.widthOfTextAtSize(payload.company_name, 11);
            drawText(payload.company_name, W - MR - compW, y, 11);
            y -= 18;

            // === Basic info table ===
            const hdrBg = rgb(0.91, 0.94, 0.99);
            const c1 = 80, c2 = 155, c3 = 80, c4 = CW - c1 - c2 - c3;
            const infoRows = [
                ['所属部署', payload.department, '役職', payload.position],
                ['出張者氏名', payload.employee_name, '', ''],
                ['出張期間', `${startDateJp} ～ ${endDateJp}`, '泊数', `${nights}泊${days}日`],
                ['出張先', payload.destination, '出張目的', purpose],
            ];
            const infoCellBg = {};
            infoRows.forEach((_, ri) => { infoCellBg[ri] = { 0: hdrBg, 2: hdrBg }; });
            y = drawTable(infoRows, [c1, c2, c3, c4], y, {
                fontSize: 9, rowHeight: 22, cellBg: infoCellBg,
                align: { 0: 'center', 2: 'center' },
            });
            y -= 12;

            // === Trip reason ===
            checkPage(40);
            drawText('■ 出張理由', ML, y, 11);
            y -= 16;
            let reasonText = payload.trip_reason || '';
            if (payload.purpose_detail) reasonText += `\n【詳細】${payload.purpose_detail}`;
            const reasonLines = reasonText.split('\n');
            const reasonH = Math.max(30, reasonLines.length * 14 + 10);
            page.drawRectangle({ x: ML, y: y - reasonH, width: CW, height: reasonH,
                borderColor: rgb(0.5, 0.5, 0.5), borderWidth: 0.5 });
            reasonLines.forEach((line, i) => {
                drawText(line, ML + 6, y - 12 - i * 14, 9);
            });
            y -= reasonH + 12;

            // === Expense details ===
            checkPage(30);
            drawText('■ 旅費明細', ML, y, 11);
            y -= 16;

            // Transport table
            if (payload.transport_details.length > 0) {
                drawText('【交通費】', ML, y, 10);
                y -= 14;
                const tHead = ['日付', '区間', '交通機関', '金額'];
                const tRows = [tHead];
                payload.transport_details.forEach(td => {
                    tRows.push([
                        formatDateJp(td.date || ''), td.route || '', td.method || '', formatCurrency(td.amount || 0),
                    ]);
                });
                const tBg = { 0: { 0: hdrBg, 1: hdrBg, 2: hdrBg, 3: hdrBg } };
                y = drawTable(tRows, [CW*0.2, CW*0.35, CW*0.2, CW*0.25], y, {
                    fontSize: 9, headerRows: 1, cellBg: tBg,
                    align: { 0: 'center', 2: 'center', 3: 'right' },
                });
                y -= 8;
            }

            // Accommodation table
            checkPage(40);
            drawText('【宿泊費・日当】', ML, y, 10);
            y -= 14;
            const sHead = ['項目', '単価', '数量', '金額'];
            const sRows = [
                sHead,
                ['宿泊費', formatCurrency(payload.accommodation_fee), `${nights}泊`, formatCurrency(totalAccommodation)],
                ['日当', formatCurrency(payload.daily_allowance), `${days}日`, formatCurrency(totalAllowance)],
                ['交通費合計', '', '', formatCurrency(transportTotal)],
            ];
            const sBg = { 0: { 0: hdrBg, 1: hdrBg, 2: hdrBg, 3: hdrBg } };
            y = drawTable(sRows, [CW*0.25, CW*0.25, CW*0.2, CW*0.3], y, {
                fontSize: 9, headerRows: 1, cellBg: sBg,
                align: { 1: 'right', 2: 'center', 3: 'right' },
            });
            y -= 10;

            // Grand total
            checkPage(25);
            const totalBg = rgb(0.12, 0.31, 0.47);
            const gtRows = [['合計支給額', formatCurrency(grandTotal)]];
            y = drawTable(gtRows, [CW * 0.35, CW * 0.65], y, {
                fontSize: 13, rowHeight: 28,
                cellBg: { 0: { 0: totalBg } },
                textColor: { 0: { 0: rgb(1,1,1) } },
                align: { 0: 'center', 1: 'right' },
            });
            y -= 12;

            // Trip report
            checkPage(40);
            drawText('■ 出張報告', ML, y, 11);
            y -= 16;
            const reportText = payload.trip_report || '';
            const reportLines = reportText.split('\n');
            const reportH = Math.max(30, reportLines.length * 14 + 10);
            page.drawRectangle({ x: ML, y: y - reportH, width: CW, height: reportH,
                borderColor: rgb(0.5, 0.5, 0.5), borderWidth: 0.5 });
            reportLines.forEach((line, i) => {
                drawText(line, ML + 6, y - 12 - i * 14, 9);
            });
            y -= reportH + 12;

            // Approval
            checkPage(50);
            drawText('■ 承認', ML, y, 11);
            y -= 16;
            const aCW = CW / 4;
            const aRows = [['申請者', '所属長', '経理部', '代表取締役'], ['', '', '', '']];
            const aBg = { 0: { 0: hdrBg, 1: hdrBg, 2: hdrBg, 3: hdrBg } };
            y = drawTable(aRows, [aCW, aCW, aCW, aCW], y, {
                fontSize: 9, headerRows: 1, bodyRowHeight: 50, cellBg: aBg,
                align: { 0: 'center', 1: 'center', 2: 'center', 3: 'center' },
            });
            y -= 10;

            // Notes
            checkPage(20);
            drawText('備考：本精算書は出張旅費規程に基づき作成されています。', ML, y, 7);
            y -= 10;
            drawText('※宿泊費は規程に定める限度額の範囲内で実費精算とします。', ML, y, 7);
            y -= 10;
            drawText('※交通費は領収書を添付してください。', ML, y, 7);

            const pdfBytes = await pdfDoc.save();
            return new Blob([pdfBytes], { type: 'application/pdf' });
        }

        function collectPayload() {
            const required = [
                { id: 'companyName', name: '会社名' },
                { id: 'employeeName', name: '氏名' },
                { id: 'destination', name: '出張先' },
                { id: 'startDate', name: '出発日' },
                { id: 'endDate', name: '帰着日' },
            ];
            for (const field of required) {
                if (!document.getElementById(field.id).value) {
                    alert(`${field.name}を入力してください`);
                    document.getElementById(field.id).focus();
                    return null;
                }
            }
            const purposes = getSelectedPurposes();
            if (purposes.length === 0) {
                alert('出張目的を1つ以上選択してください');
                return null;
            }
            const payload = {
                company_name: document.getElementById('companyName').value,
                employee_name: document.getElementById('employeeName').value,
                position: getPositionValue(),
                department: document.getElementById('department').value,
                destination: document.getElementById('destination').value,
                purpose: purposes.join('\u30FB'),
                purposes: purposes,
                purpose_detail: document.getElementById('purposeDetail').value,
                start_date: document.getElementById('startDate').value,
                end_date: document.getElementById('endDate').value,
                nights: parseInt(document.getElementById('nights').value),
                accommodation_fee: parseInt(document.getElementById('accommodationFee').value),
                daily_allowance: parseInt(document.getElementById('dailyAllowance').value),
                transport_details: getTransportDetails(),
                trip_reason: document.getElementById('tripReason').value,
                trip_report: document.getElementById('tripReport').value,
            };
            if (!payload.trip_reason) {
                payload.trip_reason = _generateTripReason(purposes, payload.destination, payload.nights, payload.purpose_detail);
            }
            if (!payload.trip_report) {
                payload.trip_report = _generateTripReport(purposes, payload.destination, payload.nights, payload.purpose_detail);
            }
            return payload;
        }

        async function generateDocument(format) {
            format = format || 'docx';
            const payload = collectPayload();
            if (!payload) return;

            const loading = document.getElementById('loading');
            loading.classList.add('active');

            // Save to history
            saveToHistory(payload);

            try {
                let blob;
                let ext;
                if (format === 'pdf') {
                    blob = await generatePdf(payload);
                    ext = '.pdf';
                } else {
                    blob = await generateDocx(payload);
                    ext = '.docx';
                }

                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `出張旅費精算書_${payload.employee_name}_${payload.start_date}${ext}`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (e) {
                console.error(e);
                alert('エラーが発生しました: ' + e.message);
            } finally {
                loading.classList.remove('active');
            }
        }

        // ============================================================
        // localStorage: Profile auto-save/restore
        // ============================================================
        const PROFILE_KEY = 'travel_expense_profile';
        const HISTORY_KEY = 'travel_expense_history';

        function saveProfile() {
            const profile = {
                companyName: document.getElementById('companyName').value,
                department: document.getElementById('department').value,
                employeeName: document.getElementById('employeeName').value,
                position: getPositionValue(),
            };
            localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
            showSavedBadge();
        }

        function loadProfile() {
            const data = localStorage.getItem(PROFILE_KEY);
            if (!data) return;
            try {
                const profile = JSON.parse(data);
                if (profile.companyName) document.getElementById('companyName').value = profile.companyName;
                if (profile.department) document.getElementById('department').value = profile.department;
                if (profile.employeeName) document.getElementById('employeeName').value = profile.employeeName;
                if (profile.position) {
                    const posSelect = document.getElementById('position');
                    const optionValues = Array.from(posSelect.options).map(o => o.value);
                    if (optionValues.includes(profile.position)) {
                        posSelect.value = profile.position;
                    } else {
                        posSelect.value = 'その他';
                        document.getElementById('positionOther').value = profile.position;
                        document.getElementById('positionOther').style.display = 'block';
                    }
                }
                showSavedBadge();
            } catch (e) {}
        }

        function showSavedBadge() {
            const badge = document.getElementById('savedBadge');
            badge.classList.add('show');
            setTimeout(() => badge.classList.remove('show'), 2000);
        }

        // Auto-save on change
        ['companyName', 'department', 'employeeName', 'position', 'positionOther'].forEach(id => {
            document.getElementById(id).addEventListener('change', saveProfile);
            document.getElementById(id).addEventListener('blur', saveProfile);
        });

        // ============================================================
        // History
        // ============================================================
        function toggleHistory() {
            const section = document.getElementById('historySection');
            const arrow = document.getElementById('historyArrow');
            if (section.style.display === 'none') {
                section.style.display = 'block';
                arrow.classList.add('open');
                renderHistory();
            } else {
                section.style.display = 'none';
                arrow.classList.remove('open');
            }
        }

        function getHistory() {
            try {
                return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
            } catch (e) { return []; }
        }

        function saveToHistory(payload) {
            const history = getHistory();
            const entry = {
                id: Date.now(),
                savedAt: new Date().toISOString(),
                data: payload,
            };
            history.unshift(entry);
            if (history.length > 20) history.length = 20;
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        }

        function deleteHistory(id) {
            let history = getHistory();
            history = history.filter(h => h.id !== id);
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            const history = getHistory();

            if (history.length === 0) {
                list.innerHTML = '<div class="history-empty">履歴はまだありません</div>';
                return;
            }

            list.innerHTML = history.map(entry => {
                const d = entry.data;
                const date = new Date(entry.savedAt);
                const dateStr = `${date.getFullYear()}/${(date.getMonth()+1).toString().padStart(2,'0')}/${date.getDate().toString().padStart(2,'0')}`;
                const nights = d.nights || 0;
                const days = nights + 1;
                const accTotal = (d.accommodation_fee || 0) * nights;
                const dailyTotal = (d.daily_allowance || 0) * days;
                const transTotal = (d.transport_details || []).reduce((s, t) => s + (t.amount || 0), 0);
                const total = accTotal + dailyTotal + transTotal;

                return `
                    <div class="history-item">
                        <div class="history-info">
                            <div class="history-title">${d.destination || '未入力'} - ${d.purpose || '未入力'}</div>
                            <div class="history-meta">${d.start_date || '?'} ～ ${d.end_date || '?'}（${nights}泊${days}日）/ 保存: ${dateStr}</div>
                        </div>
                        <div class="history-amount">${formatYen(total)}</div>
                        <div class="history-actions">
                            <button class="btn btn-secondary" onclick="loadFromHistory(${entry.id})">読込</button>
                            <button class="btn btn-danger" style="font-size:14px; padding:6px 10px;" onclick="deleteHistory(${entry.id})">&#215;</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function loadFromHistory(id) {
            const history = getHistory();
            const entry = history.find(h => h.id === id);
            if (!entry) return;

            const d = entry.data;

            document.getElementById('companyName').value = d.company_name || '';
            document.getElementById('department').value = d.department || '';
            document.getElementById('employeeName').value = d.employee_name || '';
            const posVal = d.position || '';
            const posSelect = document.getElementById('position');
            const posOptions = Array.from(posSelect.options).map(o => o.value);
            if (posOptions.includes(posVal)) {
                posSelect.value = posVal;
                document.getElementById('positionOther').style.display = 'none';
            } else {
                posSelect.value = 'その他';
                document.getElementById('positionOther').value = posVal;
                document.getElementById('positionOther').style.display = 'block';
            }

            document.getElementById('destination').value = d.destination || '';
            document.getElementById('startDate').value = d.start_date || '';
            document.getElementById('endDate').value = d.end_date || '';
            document.getElementById('nights').value = d.nights || 1;
            document.getElementById('purposeDetail').value = d.purpose_detail || '';

            const purposes = d.purposes || (d.purpose ? d.purpose.split('\u30FB') : []);
            document.querySelectorAll('#purposeCheckboxes input').forEach(cb => {
                cb.checked = purposes.includes(cb.value);
                toggleCheckbox(cb);
            });
            const otherCb = document.querySelector('#purposeCheckboxes input[value="その他"]');
            if (otherCb && otherCb.checked) {
                const knownPurposes = ['不動産会社周り', '物件視察', '企業訪問', '収益物件調査', '管理会社打合せ', 'コンサル案件', 'セミナー・研修', '契約締結・交渉', 'その他'];
                const customPurpose = purposes.find(p => !knownPurposes.includes(p));
                if (customPurpose) {
                    document.getElementById('purposeOther').value = customPurpose;
                    document.getElementById('purposeOther').style.display = 'block';
                }
            }

            document.getElementById('accommodationFee').value = d.accommodation_fee || 20000;
            document.getElementById('dailyAllowance').value = d.daily_allowance || 2000;

            const list = document.getElementById('transportList');
            list.innerHTML = '';
            const transports = d.transport_details || [];
            if (transports.length === 0) {
                addTransport();
            } else {
                transports.forEach((td, i) => {
                    addTransport();
                    const row = list.children[i];
                    row.querySelector('.t-date').value = td.date || '';
                    row.querySelector('.t-route').value = td.route || '';
                    row.querySelector('.t-method').value = td.method || '新幹線';
                    row.querySelector('.t-amount').value = td.amount || '';
                    onMethodChange(row.querySelector('.t-method'));
                });
            }

            document.getElementById('tripReason').value = d.trip_reason || '';
            document.getElementById('tripReport').value = d.trip_report || '';

            updateCalc();
            updateFeeChips();
            updateNightsChips();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ============================================================
        // Nights chips / Fee presets
        // ============================================================
        function setNights(n) {
            document.getElementById('nights').value = n;
            const start = document.getElementById('startDate').value;
            if (start) {
                const startD = new Date(start);
                startD.setDate(startD.getDate() + n);
                document.getElementById('endDate').value = startD.toISOString().split('T')[0];
                if (window.endPicker) endPicker.setDate(startD, false);
            }
            updateCalc();
            updateNightsChips();
        }

        function updateNightsChips() {
            const n = parseInt(document.getElementById('nights').value) || 0;
            document.querySelectorAll('#nightsChips .nights-chip').forEach(chip => {
                const val = parseInt(chip.textContent);
                chip.classList.toggle('active', val === n);
            });
        }

        function setFee(fieldId, amount) {
            document.getElementById(fieldId).value = amount;
            updateCalc();
            updateFeeChips();
        }

        function updateFeeChips() {
            const accVal = parseInt(document.getElementById('accommodationFee').value) || 0;
            document.querySelectorAll('#accChips .preset-chip').forEach(chip => {
                const val = parseInt(chip.textContent.replace(/[¥,]/g, ''));
                chip.classList.toggle('active', val === accVal);
            });
            const dailyVal = parseInt(document.getElementById('dailyAllowance').value) || 0;
            document.querySelectorAll('#dailyChips .preset-chip').forEach(chip => {
                const val = parseInt(chip.textContent.replace(/[¥,]/g, ''));
                chip.classList.toggle('active', val === dailyVal);
            });
        }

        // Init
        loadProfile();
        updateCalc();
        updateFeeChips();
        updateNightsChips();
    </script>

    <!-- Flatpickr -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ja.js"></script>
    <script>
        // Flatpickr calendar init
        const fpConfig = {
            locale: 'ja',
            dateFormat: 'Y-m-d',
            allowInput: true,
            disableMobile: true,
        };

        const startPicker = flatpickr('#startDate', {
            ...fpConfig,
            onChange: function(dates, dateStr) {
                if (dates[0]) {
                    const nights = parseInt(document.getElementById('nights').value) || 1;
                    const endDate = new Date(dates[0]);
                    endDate.setDate(endDate.getDate() + nights);
                    endPicker.setDate(endDate, true);
                }
                syncDates();
            }
        });

        const endPicker = flatpickr('#endDate', {
            ...fpConfig,
            onChange: function() { syncDates(); }
        });

        // Apply flatpickr to transport date inputs
        function initTransportDatePickers() {
            document.querySelectorAll('.t-date:not(.flatpickr-input)').forEach(el => {
                flatpickr(el, fpConfig);
            });
        }
        initTransportDatePickers();

        // Extend addTransport to also init date pickers
        const _origAddTransport = addTransport;
        addTransport = function() {
            _origAddTransport();
            initTransportDatePickers();
        };
    </script>
</body>
</html>
