<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出張旅費精算書 自動生成アプリ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
            min-height: 100vh;
            color: #e2e8f0;
        }

        .header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(99, 179, 237, 0.2);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(90deg, #63b3ed, #4fd1c5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 13px;
            color: #94a3b8;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(99, 179, 237, 0.15);
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 24px;
            transition: border-color 0.3s;
        }

        .card:hover {
            border-color: rgba(99, 179, 237, 0.35);
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: #63b3ed;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 20px;
            background: linear-gradient(180deg, #63b3ed, #4fd1c5);
            border-radius: 2px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
        }

        label .required {
            color: #f87171;
            margin-left: 4px;
        }

        input, select, textarea {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(99, 179, 237, 0.2);
            border-radius: 8px;
            padding: 10px 14px;
            color: #e2e8f0;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #63b3ed;
            box-shadow: 0 0 0 3px rgba(99, 179, 237, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        select {
            cursor: pointer;
        }

        .transport-row {
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(99, 179, 237, 0.1);
        }

        .transport-compact-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            align-items: end;
            margin-bottom: 4px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
        }

        .btn-secondary {
            background: rgba(99, 179, 237, 0.1);
            color: #63b3ed;
            border: 1px solid rgba(99, 179, 237, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(99, 179, 237, 0.2);
        }

        .btn-danger {
            background: rgba(248, 113, 113, 0.1);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.3);
            padding: 8px 12px;
            font-size: 18px;
            line-height: 1;
        }

        .btn-danger:hover {
            background: rgba(248, 113, 113, 0.2);
        }

        .btn-ai {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: white;
            box-shadow: 0 4px 12px rgba(109, 40, 217, 0.3);
        }

        .btn-ai:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(109, 40, 217, 0.4);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .generate-section {
            text-align: center;
            padding: 40px 0 20px;
        }

        .btn-generate {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            font-size: 18px;
            padding: 16px 48px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(5, 150, 105, 0.3);
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(5, 150, 105, 0.4);
        }

        .summary-box {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-top: 16px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .summary-row:last-child {
            border-bottom: none;
        }

        .summary-row.total {
            font-size: 18px;
            font-weight: 700;
            color: #10b981;
            padding-top: 12px;
            border-top: 2px solid rgba(16, 185, 129, 0.3);
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(99, 179, 237, 0.3);
            border-top-color: #63b3ed;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .fee-display {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .fee-display input {
            width: 140px;
        }

        .nights-calc {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 4px;
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(99, 179, 237, 0.2);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .checkbox-item:hover {
            border-color: rgba(99, 179, 237, 0.4);
        }

        .checkbox-item.checked {
            border-color: #63b3ed;
            background: rgba(99, 179, 237, 0.1);
        }

        .checkbox-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #63b3ed;
            cursor: pointer;
            flex-shrink: 0;
        }

        .checkbox-item span {
            font-size: 13px;
            color: #e2e8f0;
        }

        .transport-extras {
            grid-column: 1 / -1;
            display: none;
            gap: 8px;
        }

        .transport-extras.visible {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .transport-extras .form-group label {
            font-size: 12px;
            color: #7c8ba1;
        }

        .transport-extras input, .transport-extras select {
            font-size: 13px;
            padding: 8px 10px;
        }

        .extras-toggle {
            grid-column: 1 / -1;
            font-size: 12px;
            color: #8b5cf6;
            cursor: pointer;
            background: none;
            border: none;
            text-align: left;
            padding: 4px 0;
            font-family: inherit;
        }

        .extras-toggle:hover {
            color: #a78bfa;
        }

        /* flatpickr custom */
        .flatpickr-calendar {
            background: #1e293b !important;
            border: 1px solid rgba(99, 179, 237, 0.3) !important;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5) !important;
            border-radius: 12px !important;
        }
        .flatpickr-day.selected {
            background: #3b82f6 !important;
            border-color: #3b82f6 !important;
        }
        .flatpickr-day:hover {
            background: rgba(99, 179, 237, 0.2) !important;
        }
        .flatpickr-day.today {
            border-color: #63b3ed !important;
        }

        .preset-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }

        .preset-chip {
            padding: 4px 10px;
            font-size: 12px;
            border-radius: 16px;
            background: rgba(99, 179, 237, 0.1);
            border: 1px solid rgba(99, 179, 237, 0.25);
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .preset-chip:hover {
            background: rgba(99, 179, 237, 0.2);
            color: #e2e8f0;
            border-color: rgba(99, 179, 237, 0.4);
        }

        .preset-chip.active {
            background: rgba(59, 130, 246, 0.25);
            border-color: #3b82f6;
            color: #63b3ed;
        }

        .nights-chips {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }

        .nights-chip {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(99, 179, 237, 0.2);
            color: #94a3b8;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            font-family: inherit;
        }

        .nights-chip:hover {
            border-color: rgba(99, 179, 237, 0.5);
            color: #e2e8f0;
        }

        .nights-chip.active {
            background: #3b82f6;
            border-color: #3b82f6;
            color: white;
        }

        .saved-badge {
            display: inline-block;
            font-size: 11px;
            color: #10b981;
            margin-left: 8px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .saved-badge.show {
            opacity: 1;
        }

        .history-panel {
            margin-bottom: 24px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(99, 179, 237, 0.15);
            border-radius: 10px;
            padding: 12px 16px;
            transition: all 0.2s;
        }

        .history-item:hover {
            border-color: rgba(99, 179, 237, 0.35);
        }

        .history-info {
            flex: 1;
            min-width: 0;
        }

        .history-title {
            font-size: 14px;
            font-weight: 600;
            color: #e2e8f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-meta {
            font-size: 12px;
            color: #64748b;
            margin-top: 2px;
        }

        .history-amount {
            font-size: 14px;
            font-weight: 700;
            color: #10b981;
            margin: 0 16px;
            white-space: nowrap;
        }

        .history-actions {
            display: flex;
            gap: 6px;
        }

        .history-actions .btn {
            padding: 6px 12px;
            font-size: 12px;
        }

        .history-empty {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            padding: 20px;
        }

        .history-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: #63b3ed;
            font-size: 14px;
            font-weight: 600;
            background: none;
            border: none;
            font-family: inherit;
            padding: 0;
        }

        .history-toggle:hover {
            color: #90cdf4;
        }

        .history-toggle .arrow {
            transition: transform 0.2s;
            font-size: 12px;
        }

        .history-toggle .arrow.open {
            transform: rotate(90deg);
        }

        /* プレビューモーダル */
        .preview-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 9999;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            overflow-y: auto;
        }
        .preview-overlay.active {
            display: flex;
        }
        .preview-container {
            background: white;
            color: #1a1a1a;
            max-width: 800px;
            width: 100%;
            padding: 48px 40px;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            position: relative;
            font-family: 'Yu Mincho', 'Hiragino Mincho ProN', serif;
            font-size: 13px;
            line-height: 1.6;
            margin: 20px auto;
        }
        .preview-close {
            position: sticky;
            top: 0;
            float: right;
            background: #333;
            color: white;
            border: none;
            border-radius: 50%;
            width: 36px; height: 36px;
            font-size: 18px;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .preview-close:hover { background: #555; }
        .preview-title {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: 4px;
        }
        .preview-right {
            text-align: right;
            margin-bottom: 6px;
            font-size: 12px;
        }
        .preview-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 16px;
        }
        .preview-table th, .preview-table td {
            border: 1px solid #888;
            padding: 6px 10px;
            font-size: 12px;
            vertical-align: middle;
        }
        .preview-table th {
            background: #e8f0fe;
            font-weight: bold;
            text-align: center;
            white-space: nowrap;
            width: 90px;
        }
        .preview-section-title {
            font-size: 14px;
            font-weight: bold;
            margin: 20px 0 8px;
        }
        .preview-box {
            border: 1px solid #888;
            padding: 10px 14px;
            min-height: 50px;
            margin-bottom: 16px;
            white-space: pre-wrap;
            font-size: 12px;
            line-height: 1.7;
        }
        .preview-total-row th {
            background: #1f4e79;
            color: white;
            font-size: 14px;
        }
        .preview-total-row td {
            font-size: 16px;
            font-weight: bold;
            text-align: right;
        }
        .preview-stamp-table th {
            background: #e8f0fe;
        }
        .preview-stamp-table td {
            height: 60px;
        }
        .preview-notes {
            font-size: 10px;
            color: #666;
            margin-top: 16px;
            line-height: 1.8;
        }
        .preview-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }
        .preview-actions button {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
        }
        .preview-btn-word {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
        }
        .preview-btn-pdf {
            background: linear-gradient(135deg, #dc2626, #991b1b);
            color: white;
        }
        .preview-btn-print {
            background: #333;
            color: white;
        }
        @media print {
            body > *:not(.preview-overlay) { display: none !important; }
            .preview-overlay { position: static; background: none; padding: 0; }
            .preview-close, .preview-actions { display: none !important; }
            .preview-container { box-shadow: none; padding: 20px; margin: 0; }
        }

        @media (max-width: 500px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .transport-compact-row {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 18px;
            }
            .btn-remove {
                padding: 8px 16px;
                font-size: 13px;
            }
            .purpose-grid { grid-template-columns: 1fr !important; }
        }

        /* Purpose category styles */
        .purpose-section-label {
            font-size: 12px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            margin-top: 16px;
        }
        .purpose-section-label:first-child { margin-top: 0; }

        .purpose-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
        }

        .purpose-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(99, 179, 237, 0.2);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 12px;
            color: #e2e8f0;
            font-family: inherit;
            text-align: left;
            line-height: 1.3;
        }
        .purpose-btn:hover { border-color: rgba(99, 179, 237, 0.4); }
        .purpose-btn.selected {
            border-color: #63b3ed;
            background: rgba(99, 179, 237, 0.15);
            color: #90cdf4;
        }
        .purpose-btn.primary {
            border-color: #f59e0b;
            background: rgba(245, 158, 11, 0.15);
            box-shadow: 0 0 0 1px rgba(245, 158, 11, 0.3);
        }
        .purpose-btn .star {
            font-size: 14px;
            color: #64748b;
            flex-shrink: 0;
            cursor: pointer;
        }
        .purpose-btn.selected .star { color: #94a3b8; }
        .purpose-btn.primary .star { color: #f59e0b; }

        .category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 10px 14px;
            background: rgba(99, 179, 237, 0.05);
            border: 1px solid rgba(99, 179, 237, 0.15);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #63b3ed;
            font-family: inherit;
            margin-bottom: 4px;
            transition: all 0.2s;
        }
        .category-header:hover {
            background: rgba(99, 179, 237, 0.1);
            border-color: rgba(99, 179, 237, 0.3);
        }
        .category-header .cat-arrow {
            font-size: 11px;
            transition: transform 0.2s;
        }
        .category-header .cat-arrow.open { transform: rotate(90deg); }
        .category-header .cat-count {
            font-size: 11px;
            background: #3b82f6;
            color: white;
            border-radius: 10px;
            padding: 1px 7px;
            margin-left: 8px;
        }
        .category-items {
            padding: 6px 0 8px;
        }

        .detail-section {
            margin-top: 12px;
            padding: 12px;
            background: rgba(139, 92, 246, 0.05);
            border: 1px solid rgba(139, 92, 246, 0.15);
            border-radius: 10px;
        }
        .detail-section .purpose-section-label {
            color: #a78bfa;
        }
        .detail-group-title {
            font-size: 11px;
            color: #8b8fa3;
            margin: 8px 0 4px;
            padding-left: 2px;
        }
        .detail-group-title:first-child { margin-top: 0; }
        .detail-btn {
            display: inline-block;
            padding: 4px 10px;
            font-size: 11px;
            border-radius: 14px;
            background: rgba(139, 92, 246, 0.08);
            border: 1px solid rgba(139, 92, 246, 0.2);
            color: #c4b5fd;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            margin: 2px;
        }
        .detail-btn:hover { background: rgba(139, 92, 246, 0.15); border-color: rgba(139, 92, 246, 0.4); }
        .detail-btn.selected {
            background: rgba(139, 92, 246, 0.2);
            border-color: #8b5cf6;
            color: #e9d5ff;
        }

        .mode-toggle {
            display: flex;
            gap: 0;
            margin-bottom: 16px;
            border: 1px solid rgba(99, 179, 237, 0.2);
            border-radius: 8px;
            overflow: hidden;
        }
        .mode-btn {
            flex: 1;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            background: rgba(15, 23, 42, 0.4);
            border: none;
            color: #94a3b8;
            font-family: inherit;
            transition: all 0.2s;
        }
        .mode-btn.active {
            background: rgba(59, 130, 246, 0.2);
            color: #63b3ed;
        }
        .mode-btn:hover:not(.active) {
            background: rgba(99, 179, 237, 0.1);
        }

        .partner-field {
            margin-top: 12px;
            padding: 10px 12px;
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid rgba(16, 185, 129, 0.15);
            border-radius: 8px;
        }
        .partner-field label { color: #6ee7b7; }
        .partner-chip {
            display: inline-block;
            padding: 3px 10px;
            font-size: 11px;
            border-radius: 12px;

<body>
    <div class="header">
        <div class="header-inner">
            <div>
                <h1>出張旅費精算書 自動生成</h1>
                <p>入力するだけで税務署対応の旅費精算書をWord・PDF形式で出力</p>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- 過去の履歴 -->
        <div class="card history-panel">
            <button class="history-toggle" onclick="toggleHistory()">
                <span class="arrow" id="historyArrow">&#9654;</span>
                過去の入力データ
            </button>
            <div id="historySection" style="display: none;">
                <div class="history-list" id="historyList">
                    <div class="history-empty">履歴はまだありません</div>
                </div>
            </div>
        </div>

        <!-- 基本情報 -->
        <div class="card">
            <div class="card-title">基本情報<span class="saved-badge" id="savedBadge">保存済み</span></div>
            <div class="form-grid">
                <div class="form-group">
                    <label>会社名<span class="required">*</span></label>
                    <input type="text" id="companyName" placeholder="株式会社〇〇">
                </div>
                <div class="form-group">
                    <label>所属部署</label>
                    <input type="text" id="department" placeholder="営業部">
                </div>
                <div class="form-group">
                    <label>氏名<span class="required">*</span></label>
                    <input type="text" id="employeeName" placeholder="山田 太郎">
                </div>
                <div class="form-group">
                    <label>役職</label>
                    <select id="position" onchange="togglePositionOther(this)">
                        <option value="一般社員">一般社員</option>
                        <option value="マネージャー">マネージャー</option>
                        <option value="部長">部長</option>
                        <option value="取締役">取締役</option>
                        <option value="代表取締役">代表取締役</option>
                        <option value="代表社員">代表社員（合同会社）</option>
                        <option value="業務執行社員">業務執行社員（合同会社）</option>
                        <option value="その他">その他</option>
                    </select>
                    <input type="text" id="positionOther" placeholder="役職を入力" style="display:none; margin-top: 8px;">
                </div>
            </div>
        </div>

        <!-- 出張情報 -->
        <div class="card">
            <div class="card-title">出張情報</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>出張先<span class="required">*</span></label>
                    <input type="text" id="destination" placeholder="東京都港区">
                </div>
                <div class="form-group">
                    <label>出発日<span class="required">*</span></label>
                    <input type="date" id="startDate">
                </div>
                <div class="form-group">
                    <label>帰着日<span class="required">*</span></label>
                    <input type="date" id="endDate">
                </div>
                <div class="form-group">
                    <label>泊数<span class="required">*</span></label>
                    <input type="number" id="nights" min="1" value="1" onchange="updateCalc(); updateNightsChips();">
                    <div class="nights-chips" id="nightsChips">
                        <button class="nights-chip active" onclick="setNights(1)">1</button>
                        <button class="nights-chip" onclick="setNights(2)">2</button>
                        <button class="nights-chip" onclick="setNights(3)">3</button>
                        <button class="nights-chip" onclick="setNights(4)">4</button>
                        <button class="nights-chip" onclick="setNights(5)">5</button>
                        <button class="nights-chip" onclick="setNights(7)">7</button>
                        <button class="nights-chip" onclick="setNights(10)">10</button>
                    </div>
                    <div class="nights-calc" id="nightsCalc">1泊2日</div>
                </div>
            </div>
        </div>

        <!-- 出張目的 -->
        <div class="card">
            <div class="card-title">出張目的<span class="required" style="margin-left:4px">*</span></div>

            <div class="purpose-section-label">よく使う項目</div>
            <div class="purpose-grid" id="favoritesGrid"></div>

            <div style="margin-top: 16px;" id="categoriesContainer"></div>

            <div id="detailSection" style="display:none"></div>

            <div id="partnerSection" style="display:none" class="partner-field">
                <label>打ち合わせ相手（任意）</label>
                <div style="margin-top:6px;">
                    <button class="partner-chip" onclick="togglePartnerChip(this)" data-name="タイングさん">タイングさん</button>
                </div>
                <input type="text" id="meetingPartner" placeholder="その他の相手がいれば入力" style="margin-top:8px; font-size:13px;">
            </div>

            <div class="supplement-grid">
                <div class="form-group">
                    <label>相談内容の補足（任意）</label>
                    <textarea id="purposeDetail" rows="2" placeholder="具体的な相談内容があれば記入" oninput="onSupplementChange()"></textarea>
                </div>
                <div class="form-group">
                    <label>面談相手（任意）</label>
                    <input type="text" id="meetingPartnerGeneral" placeholder="氏名・会社名など" oninput="onSupplementChange()">
                </div>
                <div class="form-group">
                    <label>確認事項・成果（任意）</label>
                    <textarea id="resultNote" rows="2" placeholder="確認できたこと、合意事項など" oninput="onSupplementChange()"></textarea>
                </div>
                <div class="form-group">
                    <label>今後の対応（任意）</label>
                    <textarea id="nextAction" rows="2" placeholder="次回の対応予定、準備事項など" oninput="onSupplementChange()"></textarea>
                </div>
            </div>

            <div class="form-group" style="margin-top: 12px;">
                <label>その他・自由入力（任意）</label>
                <input type="text" id="purposeOther" placeholder="ボタンにない活動を入力" oninput="onSupplementChange()">
            </div>

            <div id="selectedSummary" class="selected-summary" style="display:none"></div>
        </div>

        <!-- 費用設定 -->
        <div class="card">
            <div class="card-title">費用設定</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>宿泊費（1泊あたり）</label>
                    <div class="fee-display">
                        <input type="number" id="accommodationFee" value="20000" onchange="updateCalc(); updateFeeChips();">
                        <span>円</span>
                    </div>
                    <div class="preset-chips" id="accChips">
                        <button class="preset-chip" onclick="setFee('accommodationFee', 8000)">¥8,000</button>
                        <button class="preset-chip" onclick="setFee('accommodationFee', 10000)">¥10,000</button>
                        <button class="preset-chip" onclick="setFee('accommodationFee', 15000)">¥15,000</button>
                        <button class="preset-chip active" onclick="setFee('accommodationFee', 20000)">¥20,000</button>
                        <button class="preset-chip" onclick="setFee('accommodationFee', 30000)">¥30,000</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>日当（1日あたり）</label>
                    <div class="fee-display">
                        <input type="number" id="dailyAllowance" value="2000" onchange="updateCalc(); updateFeeChips();">
                        <span>円</span>
                    </div>
                    <div class="preset-chips" id="dailyChips">
                        <button class="preset-chip active" onclick="setFee('dailyAllowance', 2000)">¥2,000</button>
                        <button class="preset-chip" onclick="setFee('dailyAllowance', 2500)">¥2,500</button>
                        <button class="preset-chip" onclick="setFee('dailyAllowance', 3000)">¥3,000</button>
                        <button class="preset-chip" onclick="setFee('dailyAllowance', 5000)">¥5,000</button>
                    </div>
                </div>
            </div>
            <p style="font-size: 11px; color: #94a3b8; margin-top: 10px; line-height: 1.6;">
                ※ 上記はよく使われる金額のプリセットです。該当しない金額の場合は、入力欄に直接ご入力ください。<br>
                ※ 金額は自社の旅費規程に基づいて設定してください。
            </p>
        </div>

        <!-- 交通費明細 -->
        <div class="card">
            <div class="card-title">交通費明細</div>
            <div id="transportList">
                <div class="transport-row" data-index="0">
                    <div class="transport-compact-row">
                        <div class="form-group">
                            <label>日付</label>
                            <input type="date" class="t-date">
                        </div>
                        <div class="form-group">
                            <label>区間</label>
                            <input type="text" class="t-route" placeholder="東京駅 → 大阪駅">
                        </div>
                    </div>
                    <div class="transport-compact-row">
                        <div class="form-group">
                            <label>交通機関</label>
                            <select class="t-method" onchange="onMethodChange(this)">
                                <option value="新幹線">新幹線</option>
                                <option value="鉄道">鉄道</option>
                                <option value="飛行機">飛行機</option>
                                <option value="バス">バス</option>
                                <option value="タクシー">タクシー</option>
                                <option value="レンタカー">レンタカー</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>金額</label>
                            <input type="number" class="t-amount" placeholder="0" onchange="updateCalc()">
                        </div>
                    </div>
                    <button class="extras-toggle" onclick="toggleExtras(this)">+ 詳細項目を追加（任意）</button>
                    <div class="transport-extras" data-method="新幹線">
                        <div class="form-group">
                            <label>座席クラス（任意）</label>
                            <select class="t-seat-class">
                                <option value="">未選択</option>
                                <option value="自由席">自由席</option>
                                <option value="指定席">指定席</option>
                                <option value="グリーン車">グリーン車</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>備考（任意）</label>
                            <input type="text" class="t-note" placeholder="往復割引等">
                        </div>
                    </div>
                    <div class="form-group" style="grid-column: 1 / -1; display: flex; justify-content: flex-end;">
                        <button class="btn btn-danger" onclick="removeTransport(this)" title="この交通費を削除" style="width: auto;">&times; 削除</button>
                    </div>
                </div>
            </div>
            <button class="btn btn-secondary" onclick="addTransport()" style="margin-top: 8px;">+ 交通費を追加</button>
        </div>

        <!-- 出張理由・報告 -->
        <div class="card">
            <div class="card-title">出張理由・報告（自動生成）</div>
            <div class="mode-toggle">
                <button class="mode-btn active" id="modeReasonBtn" onclick="setMode('reason')">出張目的</button>
                <button class="mode-btn" id="modeReportBtn" onclick="setMode('report')">実施報告</button>
            </div>

            <div id="reasonModePanel">
                <div class="form-group full-width">
                    <label>出張目的</label>
                    <textarea id="tripReason" rows="6" placeholder="上のボタンを選択すると自動生成されます" oninput="markEdited('reason')"></textarea>
                    <div class="btn-group">
                        <button class="btn btn-ai" onclick="regenerateText('reason')">再生成</button>
                    </div>
                </div>
            </div>

            <div id="reportModePanel" style="display:none;">
                <div class="purpose-section-label">実施した項目を確認してください</div>
                <div id="reportItemsConfirm"></div>
                <div class="form-group full-width" style="margin-top: 12px;">
                    <label>出張報告</label>
                    <textarea id="tripReport" rows="8" placeholder="実施した項目を選択して再生成してください" oninput="markEdited('report')"></textarea>
                    <div class="btn-group">
                        <button class="btn btn-ai" onclick="regenerateText('report')">再生成</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 合計表示 -->
        <div class="card">
            <div class="card-title">費用合計</div>
            <div class="summary-box">
                <div class="summary-row">
                    <span>宿泊費</span>
                    <span id="sumAccommodation">¥20,000</span>
                </div>
                <div class="summary-row">
                    <span>日当</span>
                    <span id="sumAllowance">¥4,000</span>
                </div>
                <div class="summary-row">
                    <span>交通費</span>
                    <span id="sumTransport">¥0</span>
                </div>
                <div class="summary-row total">
                    <span>合計支給額</span>
                    <span id="sumTotal">¥24,000</span>
                </div>
            </div>
        </div>

        <!-- 生成ボタン -->
        <div class="generate-section">
            <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px;">
                <button class="btn btn-generate" onclick="showPreview()" style="flex: 1; min-width: 280px; background: linear-gradient(135deg, #059669 0%, #047857 100%);">
                    プレビューで確認
                </button>
            </div>
            <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
                <button class="btn btn-generate" onclick="generateDocument('docx')" style="flex: 1; min-width: 200px;">
                    Word (.docx) で出力
                </button>
                <button class="btn btn-generate" onclick="generateDocument('pdf')" style="flex: 1; min-width: 200px; background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);">
                    PDF で出力
                </button>
            </div>
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 8px; color: #94a3b8;">精算書を生成中...</p>
            </div>
        </div>
    </div>

    <!-- プレビューモーダル -->
    <div class="preview-overlay" id="previewOverlay" onclick="if(event.target===this)closePreview()">
        <div class="preview-container" id="previewContent">
        </div>
    </div>

    <!-- CDN Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>

    <script>
        // ============================================================
        // UI Logic
        // ============================================================

        function togglePositionOther(sel) {
            const otherInput = document.getElementById('positionOther');
            if (sel.value === 'その他') {
                otherInput.style.display = 'block';
                otherInput.focus();
            } else {
                otherInput.style.display = 'none';
                otherInput.value = '';
            }
        }

        function getPositionValue() {
            const sel = document.getElementById('position');
            if (sel.value === 'その他') {
                return document.getElementById('positionOther').value || 'その他';
            }
            return sel.value;
        }

        // ============================================================
        // Purpose Data & State
        // ============================================================

        const PURPOSE_DATA = [
            {
                id: 'A', title: '資産形成・顧客相談', detailGroup: 'asset',
                items: [
                    { id: 'beichin', label: '米賃貸の相談' },
                    { id: 'gunyouchi', label: '軍用地の活用相談' },
                    { id: 'okinawa_hoyuu', label: '沖縄資産の保有相談' },
                    { id: 'shisan_unyou', label: '資産運用の見直し' },
                    { id: 'zeimu', label: '税務対策の相談' },
                    { id: 'souzoku', label: '相続・資産承継の相談' },
                    { id: 'kizon_follow', label: '既存顧客のフォロー' },
                ]
            },
            {
                id: 'B', title: '不動産の現地対応・調査',
                items: [
                    { id: 'fudousan_houmon', label: '不動産業者訪問', detailGroup: 'realtor' },
                    { id: 'bukken_shisatsu', label: '物件視察', detailGroup: 'inspect' },
                    { id: 'bukken_chousa', label: '物件調査', detailGroup: 'research' },
                    { id: 'tochi_chousa', label: '土地調査', detailGroup: 'land' },
                    { id: 'souba_chousa', label: '賃貸・売買相場の調査' },
                    { id: 'torihiki_kyougi', label: '取引条件・契約の協議', detailGroup: 'stakeholder' },
                ]
            },
            {
                id: 'C', title: '建築・設計・構造', detailGroup: 'construction', showPartner: true,
                items: [
                    { id: 'kenchiku_uchiawase', label: '建築業者との打ち合わせ' },
                    { id: 'sekkei_uchiawase', label: '設計の打ち合わせ' },
                    { id: 'kouzou_keisan', label: '構造計算の打ち合わせ' },
                    { id: 'beast_kouhou', label: 'ビースト工法の打ち合わせ' },
                    { id: 'kenchikuhi_kyougi', label: '建築費・見積の協議' },
                    { id: 'kouji_kakunin', label: '工事現場の確認' },
                ]
            },
            {
                id: 'D', title: '関係者・専門家との協議', detailGroup: 'stakeholder',
                items: [
                    { id: 'kinyu_kikan', label: '金融機関との打ち合わせ' },
                    { id: 'zeirishi', label: '税理士・士業との打ち合わせ' },
                    { id: 'shoukaisha', label: '紹介者・提携先との面談' },
                    { id: 'gyousei', label: '行政窓口での確認' },
                ]
            },
            {
                id: 'E', title: '登壇・研修・事例研究',
                items: [
                    { id: 'seminar', label: 'セミナー登壇・相談会' },
                    { id: 'benkyoukai', label: '勉強会・研修への参加' },
                    { id: 'shukuhaku_shisatsu', label: '宿泊施設の視察' },
                ]
            },
        ];

        const DETAIL_GROUPS = {
            asset: ['仕組みの説明', '収支の確認', '資金調達', '保有方法', '運用の見直し', '売却・承継'],
            realtor: ['案件紹介の相談', '物件情報の収集', '地域動向の情報交換', '管理・募集の相談', '提携の相談'],
            inspect: ['立地・周辺環境', '建物・設備', '管理状況', '改修の必要性'],
            research: ['権利関係', '賃貸・入居状況', '収支資料', '修繕履歴', '確認済証・検査済証'],
            land: ['接道', '境界', '用途地域・建築制限', '上下水道', '地盤・造成'],
            construction: ['計画・仕様', '構造計算', '工法の採用検討', '施工条件', '見積・費用', '工期・工程'],
            stakeholder: ['個別案件の相談', '条件確認', '資料確認', '役割分担', '次回対応'],
        };

        const FAVORITE_IDS = ['beichin', 'gunyouchi', 'fudousan_houmon', 'bukken_shisatsu', 'bukken_chousa', 'kenchiku_uchiawase', 'kouzou_keisan', 'beast_kouhou'];

        const allItems = [];
        const itemById = {};
        const itemCategory = {};
        PURPOSE_DATA.forEach(cat => {
            cat.items.forEach(item => {
                allItems.push(item);
                itemById[item.id] = item;
                itemCategory[item.id] = cat;
            });
        });

        let selectedItems = new Set();
        let selectedDetails = {};
        let primaryPurpose = null;
        let currentMode = 'reason';
        let reportConfirmed = new Set();
        let manualEdited = { reason: false, report: false };
        let openCategories = {};

        function getDetailGroup(itemId) {
            const item = itemById[itemId];
            const cat = itemCategory[itemId];
            return item.detailGroup || cat.detailGroup || null;
        }

        // ============================================================
        // Purpose UI Rendering
        // ============================================================

        function renderFavorites() {
            const grid = document.getElementById('favoritesGrid');
            grid.innerHTML = FAVORITE_IDS.map(id => {
                const item = itemById[id];
                if (!item) return '';
                const sel = selectedItems.has(id) ? 'selected' : '';
                const pri = primaryPurpose === id ? 'primary' : '';
                return `<button class="purpose-btn ${sel} ${pri}" onclick="toggleItem('${id}')" oncontextmenu="event.preventDefault();setPrimary('${id}')">
                    <span class="star" onclick="event.stopPropagation();setPrimary('${id}')" title="主目的に設定">★</span>
                    ${item.label}
                </button>`;
            }).join('');
        }

        function renderCategories() {
            const container = document.getElementById('categoriesContainer');
            container.innerHTML = PURPOSE_DATA.map(cat => {
                const count = cat.items.filter(i => selectedItems.has(i.id)).length;
                const isOpen = openCategories[cat.id];
                return `<div class="purpose-category">
                    <button class="category-header" onclick="toggleCategory('${cat.id}')">
                        <span>${cat.id}. ${cat.title}${count > 0 ? `<span class="cat-count">${count}</span>` : ''}</span>
                        <span class="cat-arrow ${isOpen ? 'open' : ''}">▸</span>
                    </button>
                    <div class="category-items" style="display:${isOpen ? 'block' : 'none'}">
                        <div class="purpose-grid">
                            ${cat.items.map(item => {
                                const sel = selectedItems.has(item.id) ? 'selected' : '';
                                const pri = primaryPurpose === item.id ? 'primary' : '';

        function toggleItem(id) {
            if (selectedItems.has(id)) {
                selectedItems.delete(id);
                if (primaryPurpose === id) primaryPurpose = selectedItems.size > 0 ? Array.from(selectedItems)[0] : null;
                Object.keys(selectedDetails).forEach(k => {
                    const g = getDetailGroup(id);
                    if (g && k.startsWith(g + ':')) {
                        const stillNeeded = Array.from(selectedItems).some(sid => getDetailGroup(sid) === g);
                        if (!stillNeeded) delete selectedDetails[k];
                    }
                });
                reportConfirmed.delete(id);
            } else {
                selectedItems.add(id);
                if (!primaryPurpose) primaryPurpose = id;
                reportConfirmed.add(id);
            }
            renderAll();
            autoGenerate();
        }

        function syncDates() {
            const start = document.getElementById('startDate').value;

            if (start && end) {

                const endD = new Date(end);
                const diff = Math.round((endD - startD) / (1000 * 60 * 60 * 24));
                if (diff > 0) {
                    document.getElementById('nights').value = diff;
                    updateCalc();
                }
            }
        }

        function updateCalc() {
            const nights = parseInt(document.getElementById('nights').value) || 1;
            const days = nights + 1;
            const accFee = parseInt(document.getElementById('accommodationFee').value) || 0;
            const dailyFee = parseInt(document.getElementById('dailyAllowance').value) || 0;

            document.getElementById('nightsCalc').textContent = `${nights}泊${days}日`;

            const totalAcc = accFee * nights;
            const totalDaily = dailyFee * days;

            let totalTransport = 0;
            document.querySelectorAll('.t-amount').forEach(el => {
                totalTransport += parseInt(el.value) || 0;
            });

            const grand = totalAcc + totalDaily + totalTransport;

            document.getElementById('sumAccommodation').textContent = formatYen(totalAcc);
            document.getElementById('sumAllowance').textContent = formatYen(totalDaily);
            document.getElementById('sumTransport').textContent = formatYen(totalTransport);
            document.getElementById('sumTotal').textContent = formatYen(grand);
        }

        function generatePurposeText() {
            const dest = document.getElementById('destination').value || '現地';
            const ordered = getOrderedSelected();
            const supplement = document.getElementById('purposeDetail')?.value?.trim() || '';
            const otherText = document.getElementById('purposeOther')?.value?.trim() || '';
            const partner = getPartnerName();

            if (ordered.length === 0 && !otherText) return '';

            const fragments = [];
            const used = new Set();

            for (let i = 0; i < ordered.length; i++) {
                if (used.has(ordered[i])) continue;
                const id = ordered[i];
                const cat = itemCategory[id];
                let combined = null;
                let combinedWith = null;
                for (let j = i + 1; j < ordered.length; j++) {
                    const otherId = ordered[j];
                    if (used.has(otherId)) continue;
                    if (itemCategory[otherId].id === cat.id) {
                        combined = buildCombinedFragment([id, otherId], 'purpose', dest, partner);
                        if (combined) { combinedWith = otherId; break; }
                    }
                }
                if (combined && combinedWith) {
                    fragments.push(combined);
                    used.add(id);
                    used.add(combinedWith);
                } else {
                    fragments.push(buildItemFragment(id, 'purpose', dest, partner));
                    used.add(id);
                }
            }
            if (otherText) fragments.push(otherText + 'を行う');

            let text = '';
            if (fragments.length === 1) {
                text = fragments[0] + 'ため。';
            } else if (fragments.length === 2) {
                text = fragments[0] + 'とともに、' + fragments[1] + 'ため。';
            } else {
                const last = fragments[fragments.length - 1];
                const rest = fragments.slice(0, -1);
                text = rest.join('。\n') + '。\nまた、' + last + 'ため。';
            }
            if (supplement) text += '\n' + supplement;
            return text;
        }

        function generateReportText() {
            const dest = document.getElementById('destination').value || '現地';
            const confirmed = Array.from(reportConfirmed).filter(id => selectedItems.has(id));
            const supplement = document.getElementById('purposeDetail')?.value?.trim() || '';
            const resultNote = document.getElementById('resultNote')?.value?.trim() || '';
            const nextAction = document.getElementById('nextAction')?.value?.trim() || '';
            const otherText = document.getElementById('purposeOther')?.value?.trim() || '';
            const partner = getPartnerName();

            if (confirmed.length === 0 && !otherText) return '';

            const fragments = [];
            const used = new Set();

            for (let i = 0; i < confirmed.length; i++) {
                if (used.has(confirmed[i])) continue;
                const id = confirmed[i];
                const cat = itemCategory[id];
                let combined = null;
                let combinedWith = null;
                for (let j = i + 1; j < confirmed.length; j++) {
                    const otherId = confirmed[j];
                    if (used.has(otherId)) continue;
                    if (itemCategory[otherId].id === cat.id) {
                        combined = buildCombinedFragment([id, otherId], 'report', dest, partner);
                        if (combined) { combinedWith = otherId; break; }
                    }
                }
                if (combined && combinedWith) {
                    fragments.push(combined);
                    used.add(id);
                    used.add(combinedWith);
                } else {
                    fragments.push(buildItemFragment(id, 'report', dest, partner));
                    used.add(id);
                }
            }
            if (otherText) fragments.push(otherText + 'を行った');

            let text = fragments.join('。\n') + '。';

            if (supplement) text += '\n' + supplement;
            if (resultNote) text += '\n\n【確認事項・成果】\n' + resultNote;
            if (nextAction) text += '\n\n【今後の対応】\n' + nextAction;

            return text;
        }

        function buildCombinedFragment(ids, mode, dest, partner) {
            const isPurpose = mode === 'purpose';
            const cat = itemCategory[ids[0]];
            const idSet = new Set(ids);
            const partnerPrefix = (cat.id === 'C' && partner) ? partner + 'と、' : '';

            // C: 構造計算 + ビースト工法
            if (cat.id === 'C' && idSet.has('kouzou_keisan') && idSet.has('beast_kouhou')) {
                const allDetails = [...new Set([...getSelectedDetails('kouzou_keisan'), ...getSelectedDetails('beast_kouhou')])]
                    .filter(d => d !== '工法の採用検討' && d !== '構造計算');
                if (allDetails.length > 0) {
                    const clauses = allDetails.map(d => {
                        switch (d) {
                            case '計画・仕様': return isPurpose
                                ? `建築計画の仕様条件を確認する`
                                : `建築計画の仕様条件を確認した`;
                            case '施工条件': return isPurpose
                                ? `現場の施工条件や制約事項を整理する`
                                : `現場の施工条件や制約事項を整理した`;
                            case '見積・費用': return isPurpose
                                ? `工事費用の見積内容を精査し、在来工法との比較を行う`
                                : `工事費用の見積内容を精査し、在来工法との比較を行った`;
                            case '工期・工程': return isPurpose
                                ? `施工スケジュールを確認し、工期短縮の効果を検討する`
                                : `施工スケジュールを確認し、工期短縮の効果を検討した`;
                            default: return isPurpose
                                ? `${d}について確認する`
                                : `${d}について確認した`;
                        }
                    });
                    const base = isPurpose
                        ? `${partnerPrefix}ビースト工法の採用検討に伴う構造計算の内容や安全性を確認する`
                        : `${partnerPrefix}ビースト工法の採用検討に伴う構造計算の内容や安全性を確認した`;
                    return base + 'とともに、' + connectClauses(clauses, true);
                }
                if (isPurpose) return `${partnerPrefix}ビースト工法の採用を見据えた構造計算について、技術的な適合性やコスト面を含めた打ち合わせを行う`;
                return `${partnerPrefix}ビースト工法の採用を見据えた構造計算について、技術的な適合性やコスト面を含めた打ち合わせを行った`;
            }

            // A: 米賃貸 + 軍用地
            if (cat.id === 'A' && idSet.has('beichin') && idSet.has('gunyouchi')) {
                const allDetails = [...new Set([...getSelectedDetails('beichin'), ...getSelectedDetails('gunyouchi')])];
                if (allDetails.includes('仕組みの説明') && allDetails.length > 1) {
                    const other = allDetails.filter(d => d !== '仕組みの説明');
                    const otherClauses = other.map(d => {
                        switch (d) {
                            case '収支の確認': return isPurpose
                                ? `それぞれの事業における収支状況や投資利回りの見通しについて確認する`
                                : `それぞれの事業における収支状況や投資利回りの見通しについて確認した`;
                            case '資金調達': return isPurpose

        // Date formatting helpers (Japanese era)
        // ============================================================

        function formatDateJp(dateStr) {
            if (!dateStr) return '';
            try {
                const parts = dateStr.split('-');
                const year = parseInt(parts[0]);
                const month = parseInt(parts[1]);
                const day = parseInt(parts[2]);
                let era, warekiYear;
                if (year >= 2019) {
                    warekiYear = year - 2018;
                    era = '令和';
                } else if (year >= 1989) {
                    warekiYear = year - 1988;
                    era = '平成';
                } else {
                    warekiYear = year - 1925;
                    era = '昭和';
                }
                return `${era}${warekiYear}年${month}月${day}日`;
            } catch (e) {
                return dateStr;
            }
        }

        function formatCurrency(amount) {
            return '\u00a5' + Number(amount).toLocaleString('ja-JP');
        }

        function buildTransportNote(td) {
            const parts = [];
            if (td.airline) parts.push(td.airline);
            if (td.flight_no) parts.push('便名:' + td.flight_no);
            if (td.seat_class) parts.push(td.seat_class);
            if (td.line) parts.push(td.line);
            if (td.taxi_reason) parts.push('理由:' + td.taxi_reason);
            if (td.rental_company) parts.push(td.rental_company);
            if (td.rental_reason) parts.push('理由:' + td.rental_reason);
            if (td.note) parts.push(td.note);
            return parts.join('\uff0f');
        }

        let _cachedFontBytes = null;

        async function loadJapaneseFont() {
            if (_cachedFontBytes) return _cachedFontBytes;
            const fontUrls = [
                'NotoSansJP-Regular.ttf',
                'https://fonts.gstatic.com/s/notosansjp/v56/-F6jfjtqLzI2JPCgQBnw7HFyzSD-AsregP8VFBEj75s.ttf',
            ];
            for (const url of fontUrls) {
                try {
                    const resp = await fetch(url);
                    if (!resp.ok) continue;
                    _cachedFontBytes = await resp.arrayBuffer();
                    return _cachedFontBytes;
                } catch (e) { console.warn('Font load failed:', url); }
            }
            throw new Error('日本語フォントの読み込みに失敗しました');
        }

        async function generatePdf(payload) {
            const { PDFDocument, rgb, StandardFonts } = PDFLib;

            const fontBytes = await loadJapaneseFont();
            const pdfDoc = await PDFDocument.create();
            pdfDoc.registerFontkit(fontkit);
            const jpFont = await pdfDoc.embedFont(fontBytes, { subset: false });

            const nights = payload.nights;
            const days = nights + 1;
            const totalAccommodation = payload.accommodation_fee * nights;
            const totalAllowance = payload.daily_allowance * days;
            const transportTotal = payload.transport_details.reduce((s, t) => s + (t.amount || 0), 0);
            const grandTotal = totalAccommodation + totalAllowance + transportTotal;

            const startDateJp = formatDateJp(payload.start_date);
            const endDateJp = formatDateJp(payload.end_date);
            const todayD = new Date();
            const todayStr = `${todayD.getFullYear()}-${String(todayD.getMonth()+1).padStart(2,'0')}-${String(todayD.getDate()).padStart(2,'0')}`;
            const todayJp = formatDateJp(todayStr);
            const purpose = payload.purpose || payload.purposes.join('・');

            // A4 dimensions in points
            const W = 595.28, H = 841.89;
            const ML = 70, MR = 70, MT = 70;
            const CW = W - ML - MR;

            let page = pdfDoc.addPage([W, H]);
            let y = H - MT;

            function checkPage(need) {
                if (y - need < 50) {
                    page = pdfDoc.addPage([W, H]);
                    y = H - MT;
                }
            }

            // Helper: draw text
            function drawText(text, x, yp, size, opts = {}) {
                page.drawText(text || '', { x, y: yp, size, font: jpFont, color: opts.color || rgb(0,0,0) });
            }

            // Helper: wrap text to fit within maxWidth (points)
            function wrapTextLines(text, fontSize, maxWidth) {
                const rawLines = (text || '').split('\n');
                const wrapped = [];
                for (const rawLine of rawLines) {
                    if (!rawLine) { wrapped.push(''); continue; }
                    const w = jpFont.widthOfTextAtSize(rawLine, fontSize);
                    if (w <= maxWidth) { wrapped.push(rawLine); continue; }
                    let cur = '';
                    for (const ch of rawLine) {
                        const test = cur + ch;
                        if (jpFont.widthOfTextAtSize(test, fontSize) > maxWidth) {
                            if (cur) wrapped.push(cur);
                            cur = ch;
                        } else {
                            cur = test;
                        }
                    }
                    if (cur) wrapped.push(cur);
                }
                return wrapped;
            }

            // Helper: draw wrapped text block in a bordered rectangle (handles page breaks)
            function drawTextBlock(text, fontSize, lineH, padX, padY) {
                const maxTextW = CW - padX * 2;
                const lines = wrapTextLines(text, fontSize, maxTextW);
                const blockH = Math.max(30, lines.length * lineH + padY * 2);
                const pageBottom = 50;
                const avail = y - pageBottom;
                if (blockH <= avail) {
                    page.drawRectangle({ x: ML, y: y - blockH, width: CW, height: blockH,
                        borderColor: rgb(0.5, 0.5, 0.5), borderWidth: 0.5 });
                    lines.forEach((line, i) => {
                        const ly = y - padY - (i + 1) * lineH + (lineH - fontSize) / 2;
                        drawText(line, ML + padX, ly, fontSize);
                    });
                    y -= blockH;
                } else {
                    // Draw line by line across pages with border segments
                    let rectStartY = y;
                    let lineIdx = 0;
                    y -= padY;
                    while (lineIdx < lines.length) {
                        if (y - lineH < pageBottom) {
                            // Close current rectangle segment
                            page.drawRectangle({ x: ML, y: pageBottom, width: CW, height: rectStartY - pageBottom,
                                borderColor: rgb(0.5, 0.5, 0.5), borderWidth: 0.5 });
                            page = pdfDoc.addPage([W, H]);
                            y = H - MT;
                            rectStartY = y;
                            y -= padY;
                        }
                        const ly = y - lineH + (lineH - fontSize) / 2;
                        drawText(lines[lineIdx], ML + padX, ly, fontSize);
                        y -= lineH;
                        lineIdx++;
                    }
                    y -= padY;
                    page.drawRectangle({ x: ML, y: y, width: CW, height: rectStartY - y,
                        borderColor: rgb(0.5, 0.5, 0.5), borderWidth: 0.5 });
                }
            }

            // Helper: draw table (with font-based wrapping and dynamic row height)
            function drawTable(rows, colWidths, startY, opts = {}) {
                const minRowH = opts.rowHeight || 22;
                const headerBg = opts.headerBg || null;
                const fontSize = opts.fontSize || 9;
                const headerRows = opts.headerRows || 0;
                const lineH = fontSize + 3;
                const cellPad = 4;
                let cy = startY;

                for (let ri = 0; ri < rows.length; ri++) {
                    const row = rows[ri];
                    const isHeader = ri < headerRows;
                    const baseRowH = isHeader ? minRowH : (opts.bodyRowHeight || minRowH);

                    // Pre-wrap all cells to determine dynamic row height
                    const cellLines = [];
                    let maxLines = 1;
                    for (let ci = 0; ci < row.length; ci++) {
                        const cw = colWidths[ci];
                        const cellText = String(row[ci] || '');
                        const maxTextW = cw - cellPad * 2;
                        const lines = wrapTextLines(cellText, fontSize, maxTextW);
                        if (lines.length === 0) lines.push('');
                        cellLines.push(lines);
                        if (lines.length > maxLines) maxLines = lines.length;
                    }
                    const currentRowH = Math.max(baseRowH, maxLines * lineH + cellPad * 2);

                    checkPage(currentRowH + 10);
                    let cx = ML;

                    for (let ci = 0; ci < row.length; ci++) {
                        const cw = colWidths[ci];
                        // Background
                        if (isHeader && headerBg) {
                            page.drawRectangle({ x: cx, y: cy - currentRowH, width: cw, height: currentRowH, color: headerBg });
                        }
                        if (opts.cellBg && opts.cellBg[ri] && opts.cellBg[ri][ci]) {
                            page.drawRectangle({ x: cx, y: cy - currentRowH, width: cw, height: currentRowH, color: opts.cellBg[ri][ci] });
                        }
                        // Border
                        page.drawRectangle({ x: cx, y: cy - currentRowH, width: cw, height: currentRowH,
                            borderColor: rgb(0.5, 0.5, 0.5), borderWidth: 0.5 });
                        // Text
                        const textColor = (opts.textColor && opts.textColor[ri] && opts.textColor[ri][ci]) || rgb(0,0,0);
                        const lines = cellLines[ci];
                        const textStartY = cy - currentRowH / 2 + (lines.length - 1) * lineH / 2;
                        lines.forEach((line, li) => {
                            const align = (opts.align && opts.align[ci]) || 'left';
                            let tx = cx + cellPad;
                            if (align === 'center') {
                                const tw = jpFont.widthOfTextAtSize(line, fontSize);
                                tx = cx + (cw - tw) / 2;
                            } else if (align === 'right') {
                                const tw = jpFont.widthOfTextAtSize(line, fontSize);
                                tx = cx + cw - tw - cellPad;
                            }
                            page.drawText(line, { x: tx, y: textStartY - li * lineH, size: fontSize, font: jpFont, color: textColor });
                        });
                        cx += cw;
                    }
                    cy -= currentRowH;
                }
                return cy;
            }

            // === Title ===
            const titleText = '出張旅費精算書';
            const titleW = jpFont.widthOfTextAtSize(titleText, 18);
            drawText(titleText, (W - titleW) / 2, y, 18);
            y -= 28;

            // === Date ===
            const dateText = `作成日：${todayJp}`;
            const dateW = jpFont.widthOfTextAtSize(dateText, 9);
            drawText(dateText, W - MR - dateW, y, 9);
            y -= 14;

            // === Company ===
            const compW = jpFont.widthOfTextAtSize(payload.company_name, 11);
            drawText(payload.company_name, W - MR - compW, y, 11);
            y -= 18;

            // === Basic info table ===
            const hdrBg = rgb(0.91, 0.94, 0.99);
            const c1 = 80, c2 = 155, c3 = 80, c4 = CW - c1 - c2 - c3;
            const infoRows = [
                ['所属部署', payload.department, '役職', payload.position],
                ['出張者氏名', payload.employee_name, '', ''],
                ['出張期間', `${startDateJp} ～ ${endDateJp}`, '泊数', `${nights}泊${days}日`],
                ['出張先', payload.destination, '出張目的', purpose],
            ];
            const infoCellBg = {};
            infoRows.forEach((_, ri) => { infoCellBg[ri] = { 0: hdrBg, 2: hdrBg }; });
            y = drawTable(infoRows, [c1, c2, c3, c4], y, {
                fontSize: 9, rowHeight: 22, cellBg: infoCellBg,
                align: { 0: 'center', 2: 'center' },
            });
            y -= 12;

            // === Trip reason ===
            checkPage(40);
            drawText('■ 出張理由', ML, y, 11);
            y -= 16;
            let reasonText = payload.trip_reason || '';
            if (payload.purpose_detail) reasonText += `\n【詳細】${payload.purpose_detail}`;
            drawTextBlock(reasonText, 9, 14, 6, 8);
            y -= 12;

            // === Expense details ===
            checkPage(30);
            drawText('■ 旅費明細', ML, y, 11);
            y -= 16;

            // Transport table
            if (payload.transport_details.length > 0) {
                drawText('【交通費】', ML, y, 10);
                y -= 14;
                const tHead = ['日付', '区間', '交通機関', '金額'];
                const tRows = [tHead];
                payload.transport_details.forEach(td => {
                    tRows.push([
                        formatDateJp(td.date || ''), td.route || '', td.method || '', formatCurrency(td.amount || 0),
                    ]);
                });
                const tBg = { 0: { 0: hdrBg, 1: hdrBg, 2: hdrBg, 3: hdrBg } };
                y = drawTable(tRows, [CW*0.2, CW*0.35, CW*0.2, CW*0.25], y, {
                    fontSize: 9, headerRows: 1, cellBg: tBg,
                    align: { 0: 'center', 2: 'center', 3: 'right' },
                });
                y -= 8;
            }

            // Accommodation table
            checkPage(40);
            drawText('【宿泊費・日当】', ML, y, 10);
            y -= 14;
            const sHead = ['項目', '単価', '数量', '金額'];
            const sRows = [
                sHead,
                ['宿泊費', formatCurrency(payload.accommodation_fee), `${nights}泊`, formatCurrency(totalAccommodation)],
                ['日当', formatCurrency(payload.daily_allowance), `${days}日`, formatCurrency(totalAllowance)],
                ['交通費合計', '', '', formatCurrency(transportTotal)],
            ];
            const sBg = { 0: { 0: hdrBg, 1: hdrBg, 2: hdrBg, 3: hdrBg } };
            y = drawTable(sRows, [CW*0.25, CW*0.25, CW*0.2, CW*0.3], y, {
                fontSize: 9, headerRows: 1, cellBg: sBg,
                align: { 1: 'right', 2: 'center', 3: 'right' },
            });
            y -= 10;

            // Grand total
            checkPage(25);
            const totalBg = rgb(0.12, 0.31, 0.47);
            const gtRows = [['合計支給額', formatCurrency(grandTotal)]];
            y = drawTable(gtRows, [CW * 0.35, CW * 0.65], y, {
                fontSize: 13, rowHeight: 28,
                cellBg: { 0: { 0: totalBg } },
                textColor: { 0: { 0: rgb(1,1,1) } },
                align: { 0: 'center', 1: 'right' },
            });
            y -= 12;

            // Trip report
            checkPage(40);
            drawText('■ 出張報告', ML, y, 11);
            y -= 16;
            const reportText = payload.trip_report || '';
            drawTextBlock(reportText, 9, 14, 6, 8);
            y -= 12;

            // Approval
            checkPage(50);
            drawText('■ 承認', ML, y, 11);
            y -= 16;
            const aCW = CW / 4;
            const aRows = [['申請者', '所属長', '経理部', '代表取締役'], ['', '', '', '']];
            const aBg = { 0: { 0: hdrBg, 1: hdrBg, 2: hdrBg, 3: hdrBg } };
            y = drawTable(aRows, [aCW, aCW, aCW, aCW], y, {
                fontSize: 9, headerRows: 1, bodyRowHeight: 50, cellBg: aBg,
                align: { 0: 'center', 1: 'center', 2: 'center', 3: 'center' },
            });
            y -= 10;

            // Notes
            checkPage(20);
            drawText('備考：本精算書は出張旅費規程に基づき作成されています。', ML, y, 7);
            y -= 10;
            drawText('※宿泊費は規程に定める限度額の範囲内で実費精算とします。', ML, y, 7);
            y -= 10;
            drawText('※交通費は領収書を添付してください。', ML, y, 7);

            const pdfBytes = await pdfDoc.save();
            return new Blob([pdfBytes], { type: 'application/pdf' });
        }

        // ============================================================
        // Preview
        // ============================================================

            const endJp = formatDateJp(payload.end_date);

                <div class="preview-section-title">■ 出張理由</div>

                <div class="preview-section-title">■ 旅費明細</div>

                <p style="font-size:12px; font-weight:bold; margin:12px 0 4px;">【宿泊費・日当】</p>

                    <tr><td>日当</td><td style="text-align:right">${formatCurrency(payload.daily_allowance)}</td><td style="text-align:center">${days}日</td><td style="text-align:right">${formatCurrency(totalDaily)}</td></tr>
